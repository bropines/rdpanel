name: helm

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - deploy/helm/**
      - .github/workflows/helm.yml
  pull_request:
    paths:
      - deploy/helm/**
      - .github/workflows/helm.yml
  # Publishes the charts of an existing release tag again (e.g. after a failed run).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.12.2
        required: true

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  CHART: deploy/helm/rdpanel
  HELM_VERSION: v3.16.4
  KUBECONFORM_VERSION: v0.6.7

jobs:
  lint:
    name: lint + kubeconform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kube: ["1.26.0", "1.30.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - name: helm lint
        run: |
          helm lint --strict "$CHART"
          for f in "$CHART"/ci/*.yaml; do helm lint --strict "$CHART" -f "$f"; done
          helm lint --strict deploy/helm/rdpanel-relay-agent
          for f in deploy/helm/rdpanel-relay-agent/ci/*.yaml; do helm lint --strict deploy/helm/rdpanel-relay-agent -f "$f"; done
      - name: template + kubeconform
        run: |
          set -euo pipefail
          for v in default "$CHART"/ci/*.yaml; do
            echo "::group::$v"
            if [ "$v" = default ]; then args=(); else args=(-f "$v"); fi
            helm template rd "$CHART" -n rustdesk "${args[@]}" \
              | kubeconform -strict -summary -kubernetes-version "${{ matrix.kube }}" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -
            echo "::endgroup::"
          done
          for v in default deploy/helm/rdpanel-relay-agent/ci/*.yaml; do
            echo "::group::relay-agent-$v"
            if [ "$v" = default ]; then args=(); else args=(-f "$v"); fi
            helm template agent deploy/helm/rdpanel-relay-agent -n rustdesk "${args[@]}" \
              | kubeconform -strict -summary -kubernetes-version "${{ matrix.kube }}" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -
            echo "::endgroup::"
          done
      - name: schema rejects invalid values
        run: |
          set -u
          for bad in "replicaCount=2" "secrets.secretKey=short" "rendezvous.service.type=Foo" "panel.realIPHeader=X-Foo"; do
            if helm template rd "$CHART" --set "$bad" >/dev/null 2>&1; then
              echo "expected failure for --set $bad"; exit 1
            fi
          done
      - name: package
        run: |
          helm package "$CHART" -d /tmp/charts
          helm package deploy/helm/rdpanel-relay-agent -d /tmp/charts

  # Tag vX.Y.Z -> oci://ghcr.io/bropines/charts/{rdpanel,rdpanel-relay-agent}:X.Y.Z
  publish:
    name: publish chart
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: package
        run: |
          v="${TAG#v}"
          helm package "$CHART" -d /tmp/charts --version "$v" --app-version "$v"
          helm package deploy/helm/rdpanel-relay-agent -d /tmp/charts --version "$v" --app-version "$v"
      # Exact file names: rdpanel-*.tgz would also match rdpanel-relay-agent-*.tgz.
      - name: push
        run: |
          v="${TAG#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/charts/rdpanel-$v.tgz" oci://ghcr.io/bropines/charts
          helm push "/tmp/charts/rdpanel-relay-agent-$v.tgz" oci://ghcr.io/bropines/charts
