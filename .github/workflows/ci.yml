name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race -count=1 ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2024.1.1 ./...
      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/rdpanel ./cmd/rdpanel

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Go 1.23 is past end-of-life, so newer standard-library advisories are only
    # fixed in later Go releases. Report them without failing the build until
    # the toolchain is bumped.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: openapi types up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  embed:
    name: build with embedded UI
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: make web build
      - name: smoke test
        run: |
          export RDPANEL_DATA_DIR="$(mktemp -d)" RDPANEL_LISTEN=127.0.0.1:21114
          ./bin/rdpanel version
          ./bin/rdpanel serve & pid=$!
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:21114/healthz && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:21114/ | grep -q '<div id="root">'
          kill "$pid"; wait "$pid"
