name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # go.mod stays at 1.23 so the code builds with the oldest toolchain we
    # support; releases are built with the latest stable Go (see image.yml),
    # which is what carries the standard-library security fixes.
    name: go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go mod tidy check
        if: matrix.go == '1.23'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race -count=1 ./...
      - name: staticcheck
        if: matrix.go == '1.23'
        run: go run honnef.co/go/tools/cmd/staticcheck@2024.1.1 ./...
      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/rdpanel ./cmd/rdpanel

  govulncheck:
    # Scans with the toolchain releases are built with; stdlib advisories fixed
    # only after Go 1.23 are therefore resolved by building with stable Go.
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web/package-lock.json is written by npm 11; node 22 ships npm 10, whose
      # `npm ci` rejects that lock file.
      - run: npm i -g npm@11
      - run: npm ci
      - name: openapi types up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  embed:
    name: build with embedded UI
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: make web build
      - name: smoke test
        run: |
          export RDPANEL_DATA_DIR="$(mktemp -d)" RDPANEL_LISTEN=127.0.0.1:21114
          ./bin/rdpanel version
          ./bin/rdpanel serve & pid=$!
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:21114/healthz && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:21114/ | grep -q '<div id="root">'
          kill "$pid"; wait "$pid"
