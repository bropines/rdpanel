# Prometheus configuration for deploy/monitoring/compose.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yaml

# No Alertmanager here: alerts are visible on the Prometheus /alerts page and
# in Grafana. Add an alerting: block to route them (mail, Telegram, ...).

scrape_configs:
  # The alert rules expect this job name.
  - job_name: rustdesk-panel
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:21114"]
        labels:
          # Optional: a readable name for the instance label in alerts.
          host: rustdesk

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
