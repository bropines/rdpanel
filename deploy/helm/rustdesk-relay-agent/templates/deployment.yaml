apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustdesk-relay-agent.fullname" . }}
  labels:
    {{- include "rustdesk-relay-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rustdesk-relay-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rustdesk-relay-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rustdesk-relay-agent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      hostNetwork: {{ .Values.hostNetwork }}
      containers:
        - name: relay-agent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RDPANEL_MODE
              value: "agent"
            - name: RDPANEL_AGENT_PANEL_URL
              value: {{ .Values.panel.url | quote }}
            - name: RDPANEL_AGENT_RELAY_PORT
              value: {{ .Values.relay.port | quote }}
            - name: RDPANEL_LOG_FORMAT
              value: {{ .Values.relay.logFormat | quote }}
            {{- if .Values.relay.hostname }}
            - name: RDPANEL_AGENT_HOSTNAME
              value: {{ .Values.relay.hostname | quote }}
            {{- end }}
            - name: RDPANEL_AGENT_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rustdesk-relay-agent.secretName" . }}
                  key: enroll-token
                  optional: true
            {{- if .Values.panel.caSecret }}
            - name: RDPANEL_AGENT_PANEL_CA
              value: "/etc/ssl/panel/ca.crt"
            {{- end }}
          ports:
            - name: relay
              containerPort: {{ .Values.relay.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: relay
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: relay
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.panel.caSecret }}
            - name: panel-ca
              mountPath: /etc/ssl/panel
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "rustdesk-relay-agent.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.panel.caSecret }}
        - name: panel-ca
          secret:
            secretName: {{ .Values.panel.caSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
