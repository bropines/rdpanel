{{- if and .Values.agent.token (not .Values.agent.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustdesk-relay-agent.secretName" . }}
  labels:
    {{- include "rustdesk-relay-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.agent.tokenSecretKey | default "token" }}: {{ .Values.agent.token | quote }}
  {{- if .Values.agent.panelCA }}
  panel-ca.crt: {{ .Values.agent.panelCA | quote }}
  {{- end }}
{{- end }}
