# Default values for rustdesk-relay-agent.
# This runs an extra hbbr relay managed by the central RD Panel (RDPANEL_MODE=agent).

image:
  repository: ghcr.io/bropines/rdpanel
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Central RD Panel connection settings
panel:
  # The public client API URL of your central RD Panel (e.g., https://desk-api.example.com)
  # The reverse proxy must allow /agent/v1/ (WebSocket) and /agent/install.sh.
  url: "https://desk-api.example.com"
  # One-time enrollment token issued by RD Panel (Server -> Relays -> Add Relay -> Relay agent).
  # Once enrolled, the agent persists its ed25519 key in the data volume.
  enrollToken: ""
  # Existing secret name holding the token under the key `enroll-token`
  existingSecret: ""
  # Optional secret holding a custom CA bundle (key `ca.crt`)
  caSecret: ""

relay:
  # hbbr port (default 21117)
  port: 21117
  # Custom hostname reported to the panel (defaults to pod name)
  hostname: ""
  # Log format: text or json
  logFormat: text

# Whether the pod should use the host network namespace.
# Recommended for bare-metal / dedicated K8s nodes so hbbr sees real client source IPs
# and avoids NAT hairpinning.
hostNetwork: false

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod securityContext. The image's entrypoint is s6-overlay's /init, which
# must start as root: it prepares /run and the data dir (chown to PUID:PGID,
# default 10001) and then runs `rdpanel agent` and hbbr unprivileged. Running
# the pod as a non-root user makes /init fail, so runAsUser/runAsNonRoot are
# not set (same as the rdpanel chart).
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Container securityContext: capabilities reduced to what s6-overlay and the
# init scripts need (chown/chmod of /data, dropping privileges, signals).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL

service:
  enabled: true
  type: LoadBalancer
  annotations: {}
  port: 21117
  nodePort: null

persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# There is no ServiceMonitor: the agent exposes no metrics endpoint (21117 is
# hbbr's relay port, not HTTP). Agent relays are monitored through the central
# panel's /metrics (rdpanel_relay_* series, docs/monitoring.md).

nodeSelector: {}
tolerations: []
affinity: {}
