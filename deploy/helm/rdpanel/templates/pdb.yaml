{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rdpanel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rdpanel.labels" . | nindent 4 }}
  {{- with include "rdpanel.annotations" (dict "root" .) }}{{ . | nindent 2 }}{{ end }}
spec:
  {{- if not (kindIs "invalid" .Values.podDisruptionBudget.minAvailable) }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rdpanel.selectorLabels" . | nindent 6 }}
{{- end }}
