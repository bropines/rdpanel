{{- if not .Values.secrets.existingSecret }}
{{- $name := include "rdpanel.fullname" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $liveData := dict }}
{{- if and $live $live.data }}{{ $liveData = $live.data }}{{ end }}
{{- /* Priority: explicit value > value in the live Secret > freshly generated. */}}
{{- $jwt := "" }}
{{- if .Values.secrets.jwtKey }}
{{- $jwt = .Values.secrets.jwtKey | b64enc }}
{{- else if hasKey $liveData .Values.secrets.jwtKeyKey }}
{{- $jwt = index $liveData .Values.secrets.jwtKeyKey }}
{{- else }}
{{- $jwt = randAlphaNum 64 | b64enc }}
{{- end }}
{{- $sk := "" }}
{{- if .Values.secrets.secretKey }}
{{- $sk = .Values.secrets.secretKey | b64enc }}
{{- else if hasKey $liveData .Values.secrets.secretKeyKey }}
{{- $sk = index $liveData .Values.secrets.secretKeyKey }}
{{- else }}
{{- /* randBytes returns base64 of N random bytes: exactly what RDPANEL_SECRET_KEY expects. */}}
{{- $sk = randBytes 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rdpanel.labels" . | nindent 4 }}
  {{- $ann := dict }}
  {{- if .Values.secrets.keep }}{{ $_ := set $ann "helm.sh/resource-policy" "keep" }}{{ end }}
  {{- with include "rdpanel.annotations" (dict "root" . "extra" $ann) }}{{ . | nindent 2 }}{{ end }}
type: Opaque
data:
  {{ .Values.secrets.jwtKeyKey }}: {{ $jwt | quote }}
  {{ .Values.secrets.secretKeyKey }}: {{ $sk | quote }}
{{- end }}
{{- if and .Values.serverKeys.enabled (not .Values.serverKeys.existingSecret) }}
{{- if not (and .Values.serverKeys.privateKey .Values.serverKeys.publicKey) }}
{{- fail "serverKeys.enabled requires serverKeys.existingSecret or both serverKeys.privateKey and serverKeys.publicKey" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rdpanel.serverKeysSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rdpanel.labels" . | nindent 4 }}
  {{- with include "rdpanel.annotations" (dict "root" . "extra" (dict "helm.sh/resource-policy" "keep")) }}{{ . | nindent 2 }}{{ end }}
type: Opaque
data:
  {{ .Values.serverKeys.privateKeyKey }}: {{ .Values.serverKeys.privateKey | trim | b64enc | quote }}
  {{ .Values.serverKeys.publicKeyKey }}: {{ .Values.serverKeys.publicKey | trim | b64enc | quote }}
{{- end }}
