{{- $fullname := include "rdpanel.fullname" . }}
# Headless governing Service for the StatefulSet (stable DNS <fullname>-0.<fullname>-headless).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rdpanel.labels" . | nindent 4 }}
  {{- with include "rdpanel.annotations" (dict "root" .) }}{{ . | nindent 2 }}{{ end }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "rdpanel.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ include "rdpanel.httpPort" . }}
      targetPort: http
      protocol: TCP
{{- if .Values.service.enabled }}
{{- $s := .Values.service }}
---
# Panel HTTP (API + admin UI + /healthz + /metrics).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rdpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: panel
    {{- with $s.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with include "rdpanel.annotations" (dict "root" . "extra" $s.annotations) }}{{ . | nindent 2 }}{{ end }}
spec:
  type: {{ $s.type }}
  {{- if and (eq $s.type "LoadBalancer") $s.loadBalancerIP }}
  loadBalancerIP: {{ $s.loadBalancerIP }}
  {{- end }}
  {{- if and (eq $s.type "LoadBalancer") $s.loadBalancerClass }}
  loadBalancerClass: {{ $s.loadBalancerClass }}
  {{- end }}
  {{- if and (eq $s.type "LoadBalancer") $s.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $s.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and (or (eq $s.type "LoadBalancer") (eq $s.type "NodePort")) $s.externalTrafficPolicy }}
  externalTrafficPolicy: {{ $s.externalTrafficPolicy }}
  {{- end }}
  {{- with $s.ipFamilyPolicy }}
  ipFamilyPolicy: {{ . }}
  {{- end }}
  {{- with $s.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "rdpanel.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
      protocol: TCP
      {{- if and (ne $s.type "ClusterIP") $s.nodePort }}
      nodePort: {{ $s.nodePort }}
      {{- end }}
{{- end }}
{{- if include "rdpanel.websocketServiceEnabled" . }}
---
# hbbs/hbbr WebSocket ports for the Ingress / HTTPRoute backends only (ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ws
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rdpanel.labels" . | nindent 4 }}
    app.kubernetes.io/component: websocket
  {{- with include "rdpanel.annotations" (dict "root" . "extra" .Values.websocket.service.annotations) }}{{ . | nindent 2 }}{{ end }}
spec:
  type: ClusterIP
  selector:
    {{- include "rdpanel.selectorLabels" . | nindent 4 }}
  ports:
    - name: hbbs-ws
      port: {{ .Values.ports.rendezvousWs }}
      targetPort: hbbs-ws
      protocol: TCP
    - name: hbbr-ws
      port: {{ .Values.ports.relayWs }}
      targetPort: hbbr-ws
      protocol: TCP
{{- end }}
