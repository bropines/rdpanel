{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rdpanel.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rdpanel.labels" . | nindent 4 }}
  {{- with include "rdpanel.annotations" (dict "root" . "extra" .Values.serviceAccount.annotations) }}{{ . | nindent 2 }}{{ end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
