{{- if and (not .Values.panel.existingSecret) .Values.panel.enrollToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rdpanel-relay-agent.fullname" . }}
  labels:
    {{- include "rdpanel-relay-agent.labels" . | nindent 4 }}
type: Opaque
data:
  enroll-token: {{ .Values.panel.enrollToken | b64enc | quote }}
{{- end }}
