  /server/health:
    get:
      tags: [server]
      operationId: getServerHealth
      summary: hbbs/hbbr reachability and presence source (admin).
      responses:
        "200":
          description: Health.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/settings:
    get:
      tags: [server]
      operationId: getServerSettings
      summary: Desired hbbs/hbbr settings, the values read back from the servers, and per-key sync state (admin).
      responses:
        "200":
          description: State.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettingsState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [server]
      operationId: updateServerSettings
      summary: Change desired settings (partial). The reconciler applies them immediately and on every hbbs/hbbr restart.
      description: |
        Validation: relay servers `host[:port]` without spaces; IPs/CIDRs via netip;
        speeds > 0. After `always_use_relay` the reconciler re-sends `relay-servers`
        (hbbs bug, see docs/research/hbbs-integration.md §1.3).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSettingsPatch" }
      responses:
        "200":
          description: New state (after one apply attempt).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettingsState" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/client-options:
    get:
      tags: [server]
      operationId: getClientOptions
      summary: Client options pushed to RustDesk clients in heartbeats (WebRTC ICE servers) (admin).
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [server]
      operationId: updateClientOptions
      summary: Replace the client options; clients pick them up on their next heartbeat.
      description: |
        Missing fields are cleared. TURN URLs need credentials (`turn://user:pass@host:port`), as RustDesk
        drops TURN entries without them. The audit trail records only the number of ICE servers.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientOptionsInput" }
      responses:
        "200":
          description: Saved options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientOptions" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/client-config:
    get:
      tags: [server]
      operationId: getClientConfig
      summary: Client connection settings and encoded configuration string for RustDesk clients (admin).
      description: |
        Returns host, relay, API URL, public key, and the base64-encoded reversed JSON string
        understood by RustDesk's "Import Server Config" / "Import from clipboard" and `--config`.
      responses:
        "200":
          description: Client configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/settings/reapply:
    post:
      tags: [server]
      operationId: reapplyServerSettings
      summary: Force the reconciler to re-apply every desired setting now (admin).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: State after re-applying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettingsState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/ip-blocker:
    get:
      tags: [server]
