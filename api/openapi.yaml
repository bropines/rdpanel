      type: string
      enum: [debug, info, warn, error]
      description: Normalised level (trace -> debug, fatal/panic -> error).
    LogEntry:
      type: object
      required: [seq, time, source, level, message, raw]
      properties:
        seq: { type: integer, format: int64, description: "Process-local id, increasing across sources (restarts at 1 when rdpanel restarts)." }
        time:
          type: [string, "null"]
          format: date-time
          description: Time from the line itself (UTC); continuation lines inherit the previous line's time.
        source: { type: string, enum: [hbbs, hbbr, panel, other] }
        level: { $ref: "#/components/schemas/LogLevel" }
        message: { type: string, description: "Message without timestamp/level; panel JSON attributes appended as key=value." }
        raw: { type: string, description: "The full line as written by the service (redacted)." }
    LogSourceInfo:
      type: object
      required: [name, lines]
      properties:
        name: { type: string, enum: [hbbs, hbbr, panel, other] }
        lines: { type: integer, description: Lines currently buffered. }
    LogPage:
      type: object
      required: [enabled, capture, capacity, sources, items, next_before]
      properties:
        enabled: { type: boolean }
        capture:
          type: string
          enum: [files, panel, "off"]
          description: |
            `files`: hbbs, hbbr and panel (s6 image, RDPANEL_LOGS_DIR); `panel`: only the panel's own
            lines (plain `rdpanel serve`); `off`: RDPANEL_LOGS_BUFFER=0.
        capacity: { type: integer, description: Lines kept per source (RDPANEL_LOGS_BUFFER). }
        sources: { type: array, items: { $ref: "#/components/schemas/LogSourceInfo" } }
        items: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
        next_before:
          type: [integer, "null"]
          format: int64
          description: Pass as `before` for older entries; null when there are none.
    RelayUsage:
      type: object
      required: [peer, elapsed_s, total_mb, highest_kbps, avg_kbps, current_kbps]
      properties:
        peer: { type: string, description: "ip:port" }
        elapsed_s: { type: integer }
        total_mb: { type: number }
        highest_kbps: { type: number }
        avg_kbps: { type: number }
        current_kbps: { type: number }
    RelayKind:
      type: string
      enum: [local, static, agent]
    RelayHealthState:
      type: string
      enum: [pending, active, degraded, offline]
      description: |
        pending = never probed / agent not approved; active = probe OK (agent: connected and config acked);
        degraded = probe OK but the agent session is down or its config lags > 5 min, or 1-2 failed probes
        (still in rotation); offline = 3 failed probes in a row (out of rotation).
    RelayAdminState:
      type: string
      enum: [enabled, draining, disabled]
    RelayAgentStatus:
      type: object
      required: [hbbr_up, hbbr_restarts, admin_rtt_ms, config_version, relays_active, total_mb, current_kbps, rx_bps, tx_bps, load1, mem_used_pct]
      properties:
        reported_at: { type: [string, "null"], format: date-time }
        hbbr_up: { type: boolean }
        hbbr_restarts: { type: integer }
        hbbr_error: { type: [string, "null"] }
        key_fp: { type: [string, "null"], description: First 8 characters of the key hbbr runs with. }
        key_matches: { type: [boolean, "null"], description: key_fp equals the hbbs public key's fingerprint. }
        admin_rtt_ms: { type: number }
        config_version: { type: integer, format: int64 }
        apply_errors: { type: object, additionalProperties: { type: string } }
        relays_active: { type: integer }
        total_mb: { type: number }
        current_kbps: { type: number }
        rx_bps: { type: number, description: Host NIC receive rate in bit/s (all traffic). }
        tx_bps: { type: number }
        load1: { type: number }
        mem_used_pct: { type: number }
    RelayAgent:
      type: object
      required: [enrolled, token_pending, require_approval, approved, connected, desired_version, acked_version, ack_errors]
      properties:
        enrolled: { type: boolean }
        token_pending: { type: boolean, description: An unused enrollment token exists. }
        enroll_expires_at: { type: [string, "null"], format: date-time }
        require_approval: { type: boolean }
        approved: { type: boolean }
        approved_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        enrolled_at: { type: [string, "null"], format: date-time }
        enrolled_from_ip: { type: [string, "null"] }
        hostname: { type: [string, "null"] }
        agent_version: { type: [string, "null"] }
        hbbr_version: { type: [string, "null"] }
        arch: { type: [string, "null"] }
        connected: { type: boolean }
        connected_at: { type: [string, "null"], format: date-time }
        remote_ip: { type: [string, "null"] }
        last_seen_at: { type: [string, "null"], format: date-time }
        desired_version: { type: integer, format: int64 }
        acked_version: { type: integer, format: int64 }
        acked_at: { type: [string, "null"], format: date-time }
        ack_errors: { type: object, additionalProperties: { type: string } }
        status:
          oneOf:
            - $ref: "#/components/schemas/RelayAgentStatus"
            - type: "null"
    Relay:
      type: object
      required: [id, name, kind, public_host, weight, in_rotation, admin_state, health, rotation_weight, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/RelayKind" }
        public_host: { type: string, description: "host[:port] handed to clients (default port 21117)." }
        mgmt_host: { type: [string, "null"], description: "Optional host[:port] used by the panel for reachability probes (defaults to public_host)." }
        region: { type: [string, "null"] }
        weight: { type: integer, minimum: 0, maximum: 5 }
        in_rotation: { type: boolean }
        admin_state: { $ref: "#/components/schemas/RelayAdminState" }
        health: { $ref: "#/components/schemas/RelayHealthState" }
        health_since: { type: [string, "null"], format: date-time }
        last_probe_at: { type: [string, "null"], format: date-time }
        last_probe_ms: { type: [number, "null"] }
        last_probe_error: { type: [string, "null"] }
        rotation_weight: { type: integer, description: Entries in hbbs' computed list (0 = not in rotation). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        agent:
          oneOf:
            - $ref: "#/components/schemas/RelayAgent"
            - type: "null"
    RelayRotationMember:
      type: object
      required: [id, name, host, weight]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        host: { type: string }
        weight: { type: integer }
    RelayRotation:
      type: object
      required: [servers, members, fallback, shrunk]
      properties:
        servers: { type: array, items: { type: string }, description: The computed `relay-servers` list (with weight duplicates). }
        members: { type: array, items: { $ref: "#/components/schemas/RelayRotationMember" } }
        fallback: { type: boolean, description: Nothing is healthy; the local relay is used anyway (hbbs never gets an empty list). }
        shrunk: { type: boolean, description: Weights were scaled down to fit hbbs' 1 KiB admin command. }
        error: { type: [string, "null"] }
        observed: { type: [array, "null"], items: { type: string }, description: What hbbs reports now (`rs`). }
        observed_error: { type: [string, "null"] }
    RelayList:
      type: object
      required: [items, rotation]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Relay" } }
        rotation: { $ref: "#/components/schemas/RelayRotation" }
    RelayCreate:
      type: object
      additionalProperties: false
      required: [kind, name, public_host]
      properties:
        kind: { type: string, enum: [static, agent] }
        name: { type: string, minLength: 1, maxLength: 64 }
        public_host: { type: string, minLength: 1, maxLength: 255, pattern: "^[^\\s,]+$" }
        mgmt_host: { type: [string, "null"], maxLength: 255, pattern: "^[^\\s,]+$" }
        region: { type: [string, "null"], maxLength: 32 }
        weight: { type: integer, minimum: 0, maximum: 5, default: 1 }
        in_rotation: { type: boolean, default: true }
    RelayPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        public_host: { type: string, minLength: 1, maxLength: 255, pattern: "^[^\\s,]+$" }
        mgmt_host: { type: [string, "null"], maxLength: 255, pattern: "^[^\\s,]+$" }
        region: { type: [string, "null"], maxLength: 32 }
        weight: { type: integer, minimum: 0, maximum: 5 }
        in_rotation: { type: boolean }
        admin_state: { $ref: "#/components/schemas/RelayAdminState" }
    RelayEnrollment:
      type: object
      required: [token, expires_at, compose, panel_url, install_command, docker_run]
      properties:
        token: { type: string, description: One-time enrollment token (only its sha256 is stored). }
        expires_at: { type: string, format: date-time }
        compose: { type: string, description: docker compose snippet for the relay host. }
        panel_url: { type: string }
        install_command:
          type: string
          description: One-line install on the relay host (`curl -fsSL <panel_url>/agent/install.sh | sudo sh -s -- --token <token>`).
        docker_run: { type: string, description: The same setup as a plain `docker run` command. }
    RelayCreated:
      type: object
      required: [relay, enrollment]
      properties:
        relay: { $ref: "#/components/schemas/Relay" }
        enrollment:
          oneOf:
            - $ref: "#/components/schemas/RelayEnrollment"
            - type: "null"
    RelayOptions:
      type: object
      additionalProperties: false
      required: [require_approval, allow_private_hosts]
      properties:
        require_approval: { type: boolean, description: New agents wait for an admin's approval after enrolling (default true). }
        allow_private_hosts: { type: boolean, description: Allow static relays / probes to private, loopback and link-local addresses (SSRF guard; default false). }
    RelaySettingsValues:
      type: object
      additionalProperties: false
      description: hbbr settings (same keys as ServerSettingsValues). In overrides, null = inherit the global profile.
      properties:
        blacklist: { type: [array, "null"], maxItems: 10000, items: { type: string } }
        blocklist: { type: [array, "null"], maxItems: 10000, items: { type: string } }
        limit_speed_mbps: { type: [number, "null"] }
        total_bandwidth_mbps: { type: [number, "null"] }
        single_bandwidth_mbps: { type: [number, "null"] }
        downgrade_threshold: { type: [number, "null"] }
        downgrade_start_check_s: { type: [integer, "null"] }
    RelaySettingsState:
      type: object
      required: [overrides, global, effective]
      properties:
        overrides: { $ref: "#/components/schemas/RelaySettingsValues" }
        global: { $ref: "#/components/schemas/RelaySettingsValues" }
        effective: { $ref: "#/components/schemas/RelaySettingsValues" }
    RelayHealthEvent:
      type: object
      required: [id, name, health, connected]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        health: { $ref: "#/components/schemas/RelayHealthState" }
        previous: { type: string }
        connected: { type: boolean }
        error: { type: string }
    ConsoleTarget:
      type: string
      enum: [hbbs, hbbr]
    ConsoleCommand:
      type: object
      required: [target, cmd, description, mutating, max_args]
      properties:
        target: { $ref: "#/components/schemas/ConsoleTarget" }
        cmd: { type: string, description: Full command name (aliases are not accepted). }
        alias: { type: string }
        args_hint: { type: string, examples: ["[Y|N]"] }
        arg_pattern: { type: string, description: Regex every argument must match. }
        max_args: { type: integer }
        description: { type: string }
        mutating: { type: boolean }
    ConsoleRequest:
      type: object
      required: [target, cmd]
      additionalProperties: false
      properties:
        target: { $ref: "#/components/schemas/ConsoleTarget" }
        cmd: { type: string }
        args: { type: array, maxItems: 8, items: { type: string, pattern: "^\\S+$" } }
    ConsoleResult:
      type: object
      required: [output, duration_ms, executed_at]
      properties:
        output: { type: string }
        truncated: { type: boolean }
        duration_ms: { type: integer }
        executed_at: { type: string, format: date-time }
    ConsoleHistoryItem:
      type: object
      required: [id, actor_name, target, cmd, args, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor_name: { type: string }
        target: { $ref: "#/components/schemas/ConsoleTarget" }
        cmd: { type: string }
        args: { type: array, items: { type: string } }
        output_excerpt: { type: [string, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ConsoleHistoryPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ConsoleHistoryItem" } }

    PanelSettings:
      type: object
      required: [public_url, admin_url, branding, auth, retention, rate_limits, trusted_proxies]
      properties:
        public_url:
          type: string
          description: "Read-only (RDPANEL_PUBLIC_URL): client API base URL; OIDC redirect URI host."
        admin_url:
          type: string
          description: "Read-only (RDPANEL_ADMIN_URL, default public_url): panel base URL."
        branding:
          type: object
          required: [title, welcome_markdown, has_logo, web_client_url]
          properties:
            title: { type: string, maxLength: 64 }
            welcome_markdown: { type: string, maxLength: 20000 }
            has_logo: { type: boolean }
            web_client_url: { type: [string, "null"] }
        auth:
          type: object
          description: Enforced at runtime (lifetimes apply to new sessions/tokens).
          required: [password_login_enabled, require_admin_2fa, require_email_2fa, session_idle_hours, session_absolute_days, client_token_lifetime_hours]
          properties:
            password_login_enabled: { type: boolean, description: "False refuses password sign-in for the user role (panel and client); admins keep it." }
            require_admin_2fa: { type: boolean }
            require_email_2fa: { type: boolean, description: Users without TOTP but with a verified address must enter an e-mailed code at sign-in. }
            session_idle_hours: { type: integer, minimum: 1, maximum: 720 }
            session_absolute_days: { type: integer, minimum: 1, maximum: 365 }
            client_token_lifetime_hours: { type: integer, minimum: 1, maximum: 87600 }
        retention:
          type: object
          description: Days to keep each audit category (the janitor uses these values); 0 = forever.
          required: [login_events_days, connection_audits_days, file_transfer_audits_days, alarm_audits_days, admin_audit_days, punch_requests_days]
          properties:
            login_events_days: { type: integer, minimum: 0 }
            connection_audits_days: { type: integer, minimum: 0 }
            file_transfer_audits_days: { type: integer, minimum: 0 }
            alarm_audits_days: { type: integer, minimum: 0 }
            admin_audit_days: { type: integer, minimum: 0 }
            punch_requests_days: { type: integer, minimum: 0 }
        rate_limits:
          type: object
          description: Read-only effective limits (server configuration).
          required: [login_free_attempts, login_base_delay_seconds, login_max_delay_seconds, device_requests_per_second, device_burst]
          properties:
            login_free_attempts: { type: integer, description: Failed logins per IP / username before backoff starts. }
            login_base_delay_seconds: { type: integer, description: First backoff delay; doubles per further failure. }
            login_max_delay_seconds: { type: integer }
            device_requests_per_second: { type: number, description: Unauthenticated device endpoints, per client IP. }
            device_burst: { type: integer }
        trusted_proxies:
          type: array
          description: Read-only (RDPANEL_TRUSTED_PROXIES); IPs/CIDRs whose forwarding headers are trusted.
          items: { type: string }
    PanelSettingsPatch:
      type: object
      additionalProperties: false
      description: |
        Partial update. `public_url`, `admin_url`, `trusted_proxies` and `rate_limits`
        are configuration values: sending them is a 400 `validation_failed` naming the
        environment variable.
      properties:
        branding:
          type: object
          additionalProperties: false
          properties:
            title: { type: string, maxLength: 64 }
            welcome_markdown: { type: string, maxLength: 20000 }
            web_client_url: { type: [string, "null"] }
        auth:
          type: object
          additionalProperties: false
          properties:
            password_login_enabled: { type: boolean }
            require_admin_2fa: { type: boolean }
            require_email_2fa: { type: boolean, description: Users without TOTP but with a verified address must enter an e-mailed code at sign-in. }
            session_idle_hours: { type: integer, minimum: 1, maximum: 720 }
            session_absolute_days: { type: integer, minimum: 1, maximum: 365 }
            client_token_lifetime_hours: { type: integer, minimum: 1, maximum: 87600 }
        retention:
          type: object
          additionalProperties: false
          properties:
            login_events_days: { type: integer, minimum: 0 }
            connection_audits_days: { type: integer, minimum: 0 }
            file_transfer_audits_days: { type: integer, minimum: 0 }
            alarm_audits_days: { type: integer, minimum: 0 }
            admin_audit_days: { type: integer, minimum: 0 }
            punch_requests_days: { type: integer, minimum: 0 }
