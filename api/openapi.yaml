        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /server/punch-requests:
    get:
      tags: [server]
      operationId: listPunchRequests
      summary: Punch requests collected from hbbs (`pr`) and stored by the panel (admin).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PunchRequestPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/relay-usage:
    get:
      tags: [server]
      operationId: getRelayUsage
      summary: Active relays from hbbr `usage` (admin).
      responses:
        "200":
          description: Active relays, by total bytes descending.
          content:
            application/json:
              schema:
                type: object
                required: [items, checked_at]
                properties:
                  checked_at: { type: string, format: date-time }
                  items: { type: array, items: { $ref: "#/components/schemas/RelayUsage" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /server/console/commands:
    get:
      tags: [server]
      operationId: listConsoleCommands
      summary: Allow-listed raw console commands (admin).
      responses:
        "200":
          description: Commands.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConsoleCommand" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/console:
    post:
      tags: [server]
      operationId: runConsoleCommand
      summary: Run one allow-listed command against hbbs/hbbr (admin, audited).
      description: |
        `cmd` must be a full command name from `/server/console/commands` for that target;
        each arg must match the command's `arg_pattern`; no spaces inside args; total < 1 KiB.
        Mutating commands change runtime state only — the reconciler may revert them to the
        desired settings; prefer the typed settings.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsoleRequest" }
      responses:
        "200":
          description: Output.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /server/console/history:
    get:
      tags: [server]
      operationId: listConsoleHistory
      summary: Recently executed console commands (from admin_audit, newest first).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleHistoryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /server/logs:
    get:
      tags: [server]
      operationId: listServerLogs
      summary: Recent hbbs/hbbr/panel log lines from the in-memory buffer (admin).
      description: |
        Newest `limit` matching entries, returned oldest first. Page back with
        `before=<next_before>`. Lines are redacted (keys, tokens, passwords) before
        they are stored. In the s6 image hbbs, hbbr and panel lines are captured
        (`capture: files`); a plain `rdpanel serve` captures only its own lines
        (`capture: panel`). With `RDPANEL_LOGS_BUFFER=0` the buffer is off
        (`enabled: false`, `capture: off`, no items).
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/Q"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        - name: before
          in: query
          description: Only entries with `seq` below this (the previous page's `next_before`).
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: "#/components/parameters/LogAfter"
      responses:
        "200":
          description: Page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/logs/download:
    get:
      tags: [server]
      operationId: downloadServerLogs
      summary: All buffered lines matching the filters as text (admin).
      description: |
        `Content-Disposition: attachment; filename="rdpanel-logs-<UTC time>.txt"`; one line per entry,
        oldest first, `[<source>] <raw line>` (redacted).
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/LogAfter"
      responses:
        "200":
          description: Log text.
          content:
            text/plain: { schema: { type: string } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: "The buffer is disabled (`logs_disabled`)." }
  /server/logs/stream:
    get:
      tags: [server]
      operationId: streamServerLogs
      summary: Live log lines as Server-Sent Events (admin).
      description: |
        `text/event-stream`, same session cookie or API token (no CSRF, GET). With `after=<seq>` buffered
        matching entries newer than `seq` are replayed first. Events:

        ```
        id: 1234
        event: log
        data: {<LogEntry>}

        event: dropped
        data: {"dropped":17}      # lines skipped because this client was too slow

        event: unauthenticated    # the session ended; the stream closes
        data: {}
        ```

        A `: keepalive` comment is sent every 15 s; the session is re-checked then.
      parameters:
        - $ref: "#/components/parameters/LogSource"
        - $ref: "#/components/parameters/LogLevel"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/LogAfter"
      responses:
        "200":
          description: Event stream (never ends on its own).
          content:
            text/event-stream: { schema: { type: string } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: "The buffer is disabled (`logs_disabled`)." }
  /relays:
    get:
      tags: [relays]
      operationId: listRelays
      summary: Relays (local, static, agents) with health, agent state and the computed hbbs relay list (admin).
      description: |
        hbbs' relay list (`relay_servers`) is computed from this table: relays that are enabled,
        in rotation, weight > 0 and `active` or `degraded`, each repeated `weight` times
        (hbbs picks relays round-robin and keeps duplicates). Failing relays leave the list
        after 3 failed end-to-end probes. See docs/relay-agents.md.
      responses:
        "200":
          description: Relays.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      tags: [relays]
      operationId: createRelay
      summary: Add a static relay or a relay agent. For an agent, the response carries the one-time enrollment token (shown once).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayCreated" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /relays/rotation:
    get:
      tags: [relays]
      operationId: getRelayRotation
      summary: The computed hbbs relay list and what hbbs currently hands out (admin).
      responses:
        "200":
          description: Rotation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayRotation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /relays/options:
    get:
      tags: [relays]
      operationId: getRelayOptions
      summary: Relay options (approval gate for new agents, private relay hosts).
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [relays]
      operationId: updateRelayOptions
      summary: Replace the relay options.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayOptions" }
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayOptions" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /relays/{id}:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    get:
      tags: [relays]
      operationId: getRelay
      summary: One relay.
      responses:
        "200":
          description: Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relay" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [relays]
      operationId: updateRelay
      summary: Change name, host, region, weight, rotation membership or admin state (enabled, draining, disabled).
      description: |
        `draining` takes the relay out of hbbs' list while running sessions continue;
        `disabled` also tells an agent to stop hbbr.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayPatch" }
      responses:
        "200":
          description: Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relay" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [relays]
      operationId: deleteRelay
      summary: Delete a static or agent relay (the local relay cannot be deleted).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /relays/{id}/enroll-token:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    post:
      tags: [relays]
      operationId: resetRelayEnrollment
      summary: Issue a new one-time enrollment token (1 h); the enrolled agent's key stops working.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Enrollment material (shown once).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelayEnrollment" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /relays/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    post:
      tags: [relays]
      operationId: approveRelay
      summary: Approve an enrolled agent (it then gets a running config).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relay" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /relays/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    post:
      tags: [relays]
      operationId: revokeRelay
      summary: Revoke an agent's key and disconnect it (re-enable with a new enrollment token).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relay" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /relays/{id}/probe:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    post:
      tags: [relays]
      operationId: probeRelay
      summary: Run the end-to-end relay probe now (two RequestRelay legs with the hbbs key; bytes must pass).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Relay after the probe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Relay" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /relays/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    get:
      tags: [relays]
      operationId: getRelaySettings
      summary: Per-relay overrides of the global relay profile (the hbbr part of /server/settings), and the effective values.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelaySettingsState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [relays]
      operationId: updateRelaySettings
      summary: Replace the overrides of an agent relay (null = inherit the global profile).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelaySettingsValues" }
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelaySettingsState" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /relays/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/RelayId"
    get:
      tags: [relays]
      operationId: getRelayUsageById
      summary: Live hbbr `usage` of one relay (local admin channel, or a command over the agent session).
      responses:
        "200":
          description: Active relays.
          content:
            application/json:
              schema:
                type: object
                required: [items, checked_at]
                properties:
                  checked_at: { type: string, format: date-time }
                  items: { type: array, items: { $ref: "#/components/schemas/RelayUsage" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Panel settings (admin).
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Partial update; each section is merged key by key.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanelSettingsPatch" }
      responses:
        "200":
          description: Settings after the update.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelSettings" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /settings/logo:
    put:
      tags: [settings]
      operationId: uploadLogo
      summary: Upload the branding logo (PNG/JPEG/WebP, ≤ 256 KiB; SVG is refused).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Branding after upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [settings]
      operationId: deleteLogo
      summary: Delete logo.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /settings/email:
    get:
      tags: [settings]
      operationId: getEmailSettings
      summary: Outgoing e-mail (SMTP) configuration; the password is never returned.
      responses:
        "200":
          description: Effective configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      operationId: updateEmailSettings
      summary: Update the panel-managed SMTP server and the default e-mail language.
      description: |
        SMTP fields are read-only (400) when `source` is `config` (RDPANEL_SMTP_HOST /
        `smtp.host` set). An empty `host` disables e-mail. `password`: omit to keep,
        `""` to clear; stored AEAD-encrypted.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSettingsInput" }
      responses:
        "200":
          description: Settings after the update.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /settings/email/test:
    post:
      tags: [settings]
      operationId: sendTestEmail
      summary: Send a test e-mail through the effective configuration.
      description: 502 `email_send_failed` carries the SMTP error message (admin only).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestEmailRequest" }
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestEmailResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: SMTP error (`email_send_failed`). }

  /events:
    servers:
      - url: /api/v1
    get:
      tags: [events]
      operationId: streamEvents
      summary: Server-Sent Events stream (presence, device updates, connections, health).
      description: |
        Mounted at `/api/v1/events` (not under `/admin`). Event names and payloads are
        listed in the top-level `x-sse-events`:

        ```
        event: presence.changed
        data: {"id":12,"rustdesk_id":"123456789","online":true,"since":"2026-10-15T10:00:00Z"}

        event: device.updated
        data: {<Device>}

        event: audit.connection
        data: {<ConnectionAudit>}

        event: hbbs.health
        data: {<ServerHealth>}
        ```
      responses:
        "200":
          description: Event stream (never ends on its own).
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /openapi.yaml:
    servers:
      - url: /api/v1
    get:
      tags: [docs]
      operationId: getOpenAPIYAML
      summary: This API contract (OpenAPI 3.1, YAML).
      description: |
        Mounted at `/api/v1/openapi.yaml` (not under `/admin`). With `RDPANEL_API_DOCS=auth`
        (default) any signed-in panel user (session cookie or Bearer API token, any role);
        `public` serves it without login, `off` answers 404. When the request is addressed
        to the `RDPANEL_ADMIN_URL` host, the relative `servers` URLs are made absolute
        against that origin. Swagger UI for it is served at `/api/v1/docs`.
      responses:
        "200":
          description: The spec as committed in `api/openapi.yaml`.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /openapi.json:
    servers:
      - url: /api/v1
    get:
      tags: [docs]
      operationId: getOpenAPIJSON
      summary: This API contract (OpenAPI 3.1, JSON).
      description: Same document as `/api/v1/openapi.yaml`, converted to JSON.
      responses:
        "200":
          description: The spec as JSON.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rdpanel_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: rdp_ + 40 base62 characters
      description: Personal API token (see `/me/api-tokens` and docs/api.md).
  parameters:
    ApiTokenId:
      name: token_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RelayId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the rdpanel_csrf cookie.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    LogSource:
      name: source
      in: query
      description: Comma-separated sources (`hbbs`, `hbbr`, `panel`, `other`); empty = all.
      schema: { type: string, example: "hbbs,hbbr" }
    LogLevel:
      name: level
      in: query
      description: Minimum level.
      schema: { $ref: "#/components/schemas/LogLevel" }
    LogAfter:
      name: after
      in: query
      description: Only entries with `seq` above this.
      schema: { type: integer, format: int64, minimum: 1 }
    Q:
      name: q
      in: query
      description: Case-insensitive substring search.
      schema: { type: string, maxLength: 200 }
    From:
      name: from
      in: query
      description: Inclusive lower time bound.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Exclusive upper time bound.
      schema: { type: string, format: date-time }
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BookId:
      name: book_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DeviceOnline:
      name: online
      in: query
      schema: { type: boolean }
    DeviceOwner:
      name: owner
      in: query
      description: Owner user id, `me` (the caller) or `none` (unassigned).
      schema: { type: string, pattern: "^([0-9]+|me|none)$" }
    DeviceGroupFilter:
      name: device_group
      in: query
      description: Device group id or `none`.
      schema: { type: string, pattern: "^([0-9]+|none)$" }
    DeviceOs:
      name: os
      in: query
      description: OS family as returned by `/devices/facets`.
      schema: { $ref: "#/components/schemas/OsFamily" }
    DeviceVersion:
      name: version
      in: query
      description: Exact client version.
      schema: { type: string }
    DeviceSeenAfter:
      name: seen_after
      in: query
      description: Only devices last seen at/after this time.
      schema: { type: string, format: date-time }
  responses:
    Unavailable:
      description: hbbs/hbbr unreachable (error code `server_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated (or session expired).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed, or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Uniqueness conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Request body or parameters are invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many failed attempts.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              examples: [unauthorized]
            message:
              type: string
              examples: [authentication required]
            fields:
              type: object
              description: Per-field validation messages (validation_failed only).
              additionalProperties: { type: string }
    CsrfToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 1024 }
        totp_code:
          type: string
          description: 6-digit TOTP code or a recovery code.
    LoginResponse:
      type: object
      required: [mfa_required]
      properties:
        mfa_required:
          type: boolean
          description: True when the password was accepted and `POST /auth/mfa` (or `/auth/mfa/passkey/*`) must follow (a 5 min pending session was issued).
        mfa_methods:
          type: array
          items: { type: string, enum: [totp, passkey, email] }
          description: "Usable second factors when `mfa_required` (`passkey` when the user has passkeys). `[email]`: a 6-digit code was e-mailed to a user without TOTP (resend with `POST /auth/mfa/resend`)."
        email_hint: { type: string, description: Masked address the code was sent to (`email` only). }
        me: { $ref: "#/components/schemas/Me" }
    CodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, description: 6-digit TOTP code or a recovery code (xxxx-xxxx-xxxx-xxxx). }
    ReauthRequest:
      type: object
      additionalProperties: false
      description: Provide the current password or a TOTP/recovery code.
      properties:
        password: { type: string }
        code: { type: string }
    ChangePasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 1024 }
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 128 }
        email: { type: [string, "null"], format: email, description: '"" or null clears it. A new address is unverified (e-mail 2FA turns off).' }
        locale: { type: [string, "null"], enum: [en, ru, null], description: Language of e-mails; null = panel default. }
    AuthOptions:
      type: object
      required: [password_reset]
      properties:
        password_reset: { type: boolean, description: '"Forgot password?" is available (SMTP and the panel URL are configured).' }
    ForgotPasswordRequest:
      type: object
      required: [login]
      additionalProperties: false
      properties:
        login: { type: string, minLength: 1, maxLength: 320, description: Username or e-mail address. }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 1024 }
    Email2faRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        password: { type: string, description: Required to disable (unless the account has no password and no TOTP). }
        code: { type: string, description: TOTP or recovery code instead of the password. }
    EmailEncryption:
      type: string
      enum: [none, starttls, tls]
    EmailSettings:
      type: object
      required: [source, enabled, host, port, username, password_set, from, encryption, insecure_skip_verify, default_locale, password_reset_available]
      properties:
        source:
          type: string
          enum: [none, config, settings]
          description: "`config`: RDPANEL_SMTP_* / smtp.* (read-only here); `settings`: managed in the panel; `none`: e-mail is off."
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password_set: { type: boolean }
        from: { type: string }
        encryption: { $ref: "#/components/schemas/EmailEncryption" }
        insecure_skip_verify: { type: boolean }
        default_locale: { type: string, enum: [en, ru] }
        password_reset_available: { type: boolean }
    EmailSettingsInput:
      type: object
      additionalProperties: false
      properties:
        host: { type: string, description: Empty disables e-mail. }
        port: { type: integer, minimum: 0, maximum: 65535, description: 0 = default for the encryption. }
        username: { type: string }
        password: { type: string, description: Omit to keep; "" clears. }
        from: { type: string, description: 'Sender, e.g. "Panel <panel@example.com>".' }
        encryption: { $ref: "#/components/schemas/EmailEncryption" }
        insecure_skip_verify: { type: boolean }
        default_locale: { type: string, enum: [en, ru] }
    TestEmailRequest:
      type: object
      additionalProperties: false
      properties:
        to: { type: string, description: "Recipient (default: my address)." }
        locale: { type: string, enum: [en, ru] }
    TestEmailResult:
      type: object
      required: [to]
      properties:
        to: { type: string }
    ProviderKind:
      type: string
      enum: [github, google, oidc]
    LoginProvider:
      type: object
      required: [slug, display_name, kind]
      properties:
        slug: { type: string }
        display_name: { type: string }
        kind: { $ref: "#/components/schemas/ProviderKind" }
    OidcStartRequest:
      type: object
      additionalProperties: false
      properties:
        next:
          type: string
          description: Relative path to return to (anything else falls back to the default).
    UrlResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    SecurityOverview:
      type: object
      required: [has_password, totp_enabled, totp_pending, totp_required, must_enroll_totp, recovery_codes_remaining, passkeys_available, passkey_count, email, email_verified, email_2fa_enabled, email_2fa_required, email_available, locale]
      properties:
        has_password: { type: boolean }
        totp_enabled: { type: boolean }
        totp_pending: { type: boolean, description: An unconfirmed enrolment exists. }
        totp_required: { type: boolean, description: Policy (user flag or admin policy) requires 2FA. }
        must_enroll_totp: { type: boolean }
        recovery_codes_remaining: { type: integer }
        passkeys_available: { type: boolean, description: The server has a WebAuthn relying party configured. }
        passkey_count: { type: integer }
        email: { type: [string, "null"] }
        email_verified: { type: boolean }
        email_2fa_enabled: { type: boolean, description: E-mailed sign-in codes are on (used when TOTP is off). }
        email_2fa_required: { type: boolean, description: Admin policy requires e-mail codes for accounts without TOTP (verified address). }
        email_available: { type: boolean, description: SMTP is configured. }
        locale: { type: [string, "null"], enum: [en, ru, null] }
    PasskeyCeremony:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id: { type: string, description: Opaque single-use id to post back to the matching finish call. }
        options:
          type: object
          additionalProperties: true
          description: |
            JSON form of `CredentialCreationOptions` / `CredentialRequestOptions`:
            `{publicKey: {...}, mediation?}`, binary members (challenge, user.id,
            credential ids) base64url without padding.
    PasskeyFinishRequest:
      type: object
      required: [ceremony_id, credential]
      additionalProperties: false
      properties:
        ceremony_id: { type: string }
        credential:
          type: object
          additionalProperties: true
          description: "`PublicKeyCredential.toJSON()` (id, rawId, type, response with base64url members)."
    PasskeyRegisterFinishRequest:
      type: object
      required: [ceremony_id, credential]
      additionalProperties: false
      properties:
        ceremony_id: { type: string }
        name: { type: string, maxLength: 64, description: 'Display name ("Passkey" when empty).' }
        credential:
          type: object
          additionalProperties: true
          description: "`PublicKeyCredential.toJSON()` of the attestation."
    PasskeyRename:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    ApiToken:
      type: object
      description: A personal API token (metadata only, never the secret).
      required: [id, name, prefix, scope, created_at, expires_at, last_used_at, last_used_ip, expired]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 64 }
        prefix: { type: string, description: "First characters of the token (`rdp_` + 6), for recognising it." }
        scope: { type: string, enum: [read, write], description: "`read`: GET/HEAD only; `write`: full rights of the owner." }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time, description: Null = never expires. }
        last_used_at: { type: [string, "null"], format: date-time, description: Updated at most once a minute. }
        last_used_ip: { type: [string, "null"] }
        expired: { type: boolean }
    ApiTokenCreated:
      type: object
      required: [api_token, token]
      properties:
        api_token: { $ref: "#/components/schemas/ApiToken" }
        token: { type: string, description: "The secret (`rdp_...`). Shown only once; store it now." }
    CreateApiTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scope: { type: string, enum: [read, write] }
        expires_in_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
          description: Days until expiry; null or absent = never.
    Passkey:
      type: object
      required: [id, name, created_at, last_used_at, backup_eligible, synced, clone_warning, transports]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        backup_eligible: { type: boolean, description: Multi-device (syncable) credential. }
        synced: { type: boolean, description: The credential is backed up / synced (backup state flag). }
        clone_warning: { type: boolean, description: The signature counter went backwards; sign-in with it is refused. }
        transports: { type: array, items: { type: string } }
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 seed for manual entry. }
        otpauth_uri: { type: string, description: otpauth://totp/... URI to render as a QR code. }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          description: Shown once; only hashes are stored.
    IdentityProvider:
      type: object
      required: [id, slug, kind, display_name, client_id, has_client_secret, issuer, scopes, pkce_enabled, pkce_method, auto_register, link_by_verified_email, enabled, sort_order, callback_url, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, description: Name clients see as oidc/<slug>. }
        kind: { type: string, enum: [github, google, oidc, linuxdo] }
        display_name: { type: string }
        client_id: { type: string }
        has_client_secret: { type: boolean, description: The secret itself is write-only. }
        issuer: { type: [string, "null"], description: OIDC only; Google is fixed to https://accounts.google.com. }
        scopes:
          type: array
          items: { type: string }
          description: Empty = defaults (openid profile email; GitHub read:user user:email).
        pkce_enabled: { type: boolean }
        pkce_method: { type: string, enum: [S256, plain] }
        auto_register: { type: boolean }
        link_by_verified_email:
          type: boolean
          description: Link to an existing user by email only when the IdP asserts email_verified.
        enabled: { type: boolean }
        sort_order: { type: integer }
        callback_url: { type: string, description: 'Redirect URI to register at the IdP ("" without a public URL).' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IdentityProviderInput:
      type: object
      required: [slug, kind, client_id]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
        kind: { $ref: "#/components/schemas/ProviderKind" }
        display_name: { type: string, maxLength: 128 }
        client_id: { type: string, maxLength: 512 }
        client_secret:
          type: [string, "null"]
          description: Omitted/null keeps the stored secret; empty string clears it.
        issuer: { type: [string, "null"], description: Required for kind=oidc. }
        scopes: { type: array, items: { type: string } }
        pkce_enabled: { type: boolean, default: true }
        pkce_method: { type: string, enum: [S256, plain], default: S256 }
        auto_register: { type: boolean, default: false }
        link_by_verified_email: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
        sort_order: { type: integer, default: 0 }
    IdentityProviderPatch:
      type: object
      additionalProperties: false
      description: Same fields as IdentityProviderInput, all optional.
      properties:
        slug: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
        kind: { $ref: "#/components/schemas/ProviderKind" }
        display_name: { type: string, maxLength: 128 }
        client_id: { type: string, maxLength: 512 }
        client_secret: { type: [string, "null"], description: Omitted/null keeps the stored secret; empty string clears it. }
        issuer: { type: [string, "null"] }
        scopes: { type: array, items: { type: string } }
        pkce_enabled: { type: boolean }
        pkce_method: { type: string, enum: [S256, plain] }
        auto_register: { type: boolean }
        link_by_verified_email: { type: boolean }
        enabled: { type: boolean }
        sort_order: { type: integer }
    IdentityProviderTestResult:
      type: object
      required: [ok, callback_url]
      properties:
        ok: { type: boolean }
        error: { type: string }
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        userinfo_endpoint: { type: string }
        jwks_uri: { type: string }
        callback_url: { type: string }
    Role:
      type: string
      enum: [admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      required: [id, username, display_name, role, status, has_password, totp_enabled, email_verified, email_2fa_enabled, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: [string, "null"] }
        display_name: { type: string }
        avatar_url: { type: string }
        note: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        user_group_id: { type: [integer, "null"], format: int64 }
        has_password: { type: boolean }
        totp_enabled: { type: boolean }
        totp_required: { type: boolean }
        email_verified: { type: boolean, description: The current address was confirmed with an e-mailed code (or by an admin). }
        email_2fa_enabled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Me:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        must_enroll_totp:
          type: boolean
          description: True when 2FA is required for this account but not yet enrolled.
    Session:
      type: object
      description: An active panel session or client token of a user.
      required: [id, kind, created_at, expires_at, current]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [client, web] }
        device_rustdesk_id: { type: [string, "null"] }
        device_uuid: { type: [string, "null"] }
        client_platform: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: True for the session making the request. }
    Device:
      type: object
      required: [id, rustdesk_id, online, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        rustdesk_id: { type: string }
        uuid: { type: [string, "null"] }
        hostname: { type: string }
        os: { type: string }
        cpu: { type: string }
        memory: { type: string }
        os_username: { type: string }
        client_version: { type: string }
        alias: { type: string }
        note: { type: string }
        owner_user_id: { type: [integer, "null"], format: int64 }
        device_group_id: { type: [integer, "null"], format: int64 }
        owner:
          description: Embedded owner (null = unassigned).
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        device_group:
          oneOf:
            - $ref: "#/components/schemas/GroupRef"
            - type: "null"
        os_family: { $ref: "#/components/schemas/OsFamily" }
        online: { type: boolean, description: "Live presence (hbbs OnlineRequest, heartbeat fallback)." }
        online_since: { type: [string, "null"], format: date-time, description: Start of the current online/offline streak. }
        last_seen_at: { type: [string, "null"], format: date-time }
        last_seen_ip: { type: [string, "null"] }
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        sysinfo_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Permission:
      type: string
      enum: [read, read_write, full]
    AddressBook:
      type: object
      required: [id, guid, owner_user_id, owner, name, is_personal, permission, entry_count, share_count, has_default_password, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        guid: { type: string }
        owner_user_id: { type: integer, format: int64 }
        owner: { $ref: "#/components/schemas/UserRef" }
        name: { type: string }
        note: { type: string }
        is_personal: { type: boolean }
        permission:
          $ref: "#/components/schemas/Permission"
          description: Effective permission of the current user (admins have `full` on every book).
        entry_count: { type: integer }
        share_count: { type: integer }
        has_default_password: { type: boolean, description: Shared books only; the password itself is write-only. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Entry:
      type: object
      description: Address-book entry. Passwords/hashes are write-only (never returned).
      required: [id, address_book_id, rustdesk_id, tags, has_password, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        address_book_id: { type: integer, format: int64 }
        rustdesk_id: { type: string }
        alias: { type: string }
        os_username: { type: string }
        hostname: { type: string }
        platform: { type: string }
        login_name: { type: string }
        note: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        has_password: { type: boolean }
        force_always_relay: { type: boolean }
        rdp_port: { type: string }
        rdp_username: { type: string }
        same_server: { type: boolean }
        online: { type: [boolean, "null"], description: "Live presence when the id is a known device, else null." }
        device_id: { type: [integer, "null"], format: int64, description: "Matching device row, if any." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Tag:
      type: object
      required: [id, address_book_id, name, color_argb, entry_count]
      properties:
        id: { type: integer, format: int64 }
        address_book_id: { type: integer, format: int64 }
        name: { type: string }
        color_argb: { $ref: "#/components/schemas/ArgbColor" }
        entry_count: { type: integer }
    Page:
      type: object
      description: Generic page envelope; stream B specialises per resource.
      required: [total, items]
      properties:
        total: { type: integer }
        items: { type: array, items: {} }

    # ───────────────────────────── stream D: resources ─────────────────────────────

    PageMeta:
      type: object
      required: [total, page, page_size]
      properties:
        total: { type: integer, description: Total number of matching items. }
        page: { type: integer }
        page_size: { type: integer }
    BulkResult:
      type: object
      required: [affected]
      properties:
        affected: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [id, code, message]
            properties:
              id: { type: [integer, string] }
              code: { type: string }
              message: { type: string }
    RevokeResult:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer }
    ArgbColor:
      type: integer
      format: int64
      minimum: 0
      maximum: 4294967295
      description: Flutter ARGB uint32, e.g. 4288585374 (0xFF9E9E9E).
    UserRef:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    OsFamily:
      type: string
      enum: [windows, macos, linux, android, ios, other]
    Branding:
      type: object
      required: [title, logo_url, welcome_markdown]
      properties:
        title: { type: string }
        logo_url: { type: [string, "null"], description: "Same-origin URL of the uploaded logo (cache-busted), or null." }
        welcome_markdown:
          type: string
          description: Markdown shown on the dashboard; `{{username}}` is substituted client-side. Rendered sanitized (DOMPurify).
        web_client_url: { type: [string, "null"], description: Optional external RustDesk web client link-out. }

    Dashboard:
      type: object
      required: [devices_total, devices_online, users_total, address_books_total, logins_24h, failed_logins_24h, connections_24h, active_connections, series, version]
      properties:
        devices_total: { type: integer }
        devices_online: { type: integer }
        users_total: { type: integer }
        address_books_total: { type: integer }
        logins_24h: { type: integer }
        failed_logins_24h: { type: integer }
        connections_24h: { type: integer }
        active_connections: { type: integer }
        series:
          type: object
          required: [logins, connections, online]
          description: 24 hourly buckets, oldest first; `t` is the bucket start.
          properties:
            logins: { type: array, items: { $ref: "#/components/schemas/SeriesPoint" } }
            connections: { type: array, items: { $ref: "#/components/schemas/SeriesPoint" } }
            online: { type: array, items: { $ref: "#/components/schemas/SeriesPoint" }, description: Max devices online per hour. }
        health:
          description: Null for the `user` role.
          oneOf:
            - $ref: "#/components/schemas/ServerHealth"
            - type: "null"
        version: { $ref: "#/components/schemas/VersionInfo" }
    SeriesPoint:
      type: object
      required: [t, v]
      properties:
        t: { type: string, format: date-time }
        v: { type: integer }
    VersionInfo:
      type: object
      required: [panel]
      properties:
        panel: { type: string }
        commit: { type: string }
        build_date: { type: string }
        go: { type: string }
    About:
      type: object
      required: [name, version, hbb, update, server]
      properties:
        name: { type: string, description: Product name (RD Panel). }
        version: { $ref: "#/components/schemas/VersionInfo" }
        hbb: { $ref: "#/components/schemas/AboutHbb" }
        update: { $ref: "#/components/schemas/UpdateCheck" }
        server:
          description: Null for the `user` role.
          oneOf:
            - $ref: "#/components/schemas/AboutServer"
            - type: "null"
    AboutHbb:
      type: object
      description: Source of the bundled hbbs/hbbr (container image build args HBB_REPO / HBB_REF); null when not built in.
      required: [repo, ref]
      properties:
        repo: { type: [string, "null"], description: "e.g. https://github.com/bropines/rustdesk-server" }
        ref: { type: [string, "null"], description: Commit or `git describe` of the server fork. }
    UpdateCheck:
      type: object
      required: [status, latest, latest_url, published_at, checked_at, error]
      properties:
        status:
          type: string
          enum: [disabled, unknown, error, up_to_date, update_available]
          description: |
            disabled = RDPANEL_UPDATE_CHECK=false; unknown = no release published or the running version is not
            a semantic version (e.g. a dev build); error = the check failed and no earlier answer is cached.
        latest: { type: [string, "null"], description: Tag of the latest GitHub release. }
        latest_url: { type: [string, "null"], description: Release page. }
        published_at: { type: [string, "null"], format: date-time }
        checked_at: { type: [string, "null"], format: date-time, description: Last attempt (cached answers keep their time). }
        error: { type: [string, "null"], description: Last failure; admins only. }
    AboutServer:
      type: object
      required: [started_at, uptime_s, schema_version, schema_latest, os, arch, health]
      properties:
        started_at: { type: string, format: date-time }
        uptime_s: { type: integer }
        schema_version: { type: [integer, "null"], description: Applied goose migration. }
        schema_latest: { type: [integer, "null"], description: Newest migration embedded in this binary. }
        os: { type: string }
        arch: { type: string }
        health: { $ref: "#/components/schemas/ServerHealth" }

    DeviceFacets:
      type: object
      required: [os, versions, total]
      properties:
        total: { type: integer }
        os:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value: { $ref: "#/components/schemas/OsFamily" }
              count: { type: integer }
        versions:
          type: array
          items:
            type: object
            required: [value, count]
            properties:
              value: { type: string }
              count: { type: integer }
    DevicePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Device" } }
    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          required: [recent_connections, address_books]
          properties:
            recent_connections:
              type: array
              description: Last 10 connections to this device.
              items: { $ref: "#/components/schemas/ConnectionAudit" }
            address_books:
              type: array
              description: Books (visible to the caller) containing this id.
              items: { $ref: "#/components/schemas/GroupRef" }
    DeviceUpdate:
      type: object
      additionalProperties: false
      properties:
        alias: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 4096 }
        owner_user_id: { type: [integer, "null"], format: int64, description: Admin only. }
        device_group_id: { type: [integer, "null"], format: int64, description: Admin only. }
    DeviceBulkRequest:
      type: object
      required: [action, device_ids]
      additionalProperties: false
      properties:
        action: { type: string, enum: [assign_owner, assign_group, kick, delete] }
        device_ids: { type: array, minItems: 1, maxItems: 1000, items: { type: integer, format: int64 } }
        owner_user_id: { type: [integer, "null"], format: int64 }
        device_group_id: { type: [integer, "null"], format: int64 }
    PresenceChangedEvent:
