openapi: 3.1.0
info:
  title: RD Panel admin API
  version: 0.1.0
  summary: Panel JSON API consumed by the embedded React SPA.
  description: |
    Contract between the backend (`internal/adminapi`) and the web UI (`web/`).
    Regenerate the TypeScript types with `npm run gen:api` (in `web/`).

    **Authentication.** Cookie session: `rdpanel_session` (HttpOnly, SameSite=Lax,
    Secure on https) holding an opaque token (sha256 stored server-side, kind `web`),
    12 h idle / 7 d absolute.

    **API tokens.** Scripts can send `Authorization: Bearer rdp_...` instead of the
    cookie (`bearerAuth`; create tokens under Profile & security or `POST /me/api-tokens`,
    see docs/api.md). A token acts as its owner with the owner's current role; it is
    refused (401) when expired, revoked or the owner is disabled, and failed attempts are
    rate-limited per IP. Scope `read` allows only GET/HEAD (403 `insufficient_scope`).
    Tokens cannot mint or revoke tokens nor use `/me/security/*` (403
    `cookie_session_required`). They also work on `GET /api/v1/events`, never on the
    RustDesk client API (`/api/*`).

    **CSRF.** Double submit: every non-GET request must send header `X-CSRF-Token`
    equal to the `rdpanel_csrf` cookie (obtain/refresh it with `GET /auth/csrf`).
    Requests authenticated with a Bearer API token need no CSRF header.

    **Errors.** Every non-2xx response has the body `{"error":{"code","message"}}`.
    `code` is stable and machine-readable (`unauthorized`, `forbidden`, `csrf_failed`,
    `not_found`, `conflict`, `validation_failed`, `rate_limited`, `totp_required`,
    `totp_invalid`, `internal`, `invalid_credentials`, `password_login_disabled`,
    `totp_enrollment_required`, `reauth_failed`, `oidc_not_configured`,
    `provider_unavailable`, `last_admin`, `server_unavailable`, `passkey_failed`,
    `passkeys_unavailable`, `no_passkeys`, `passkey_limit`, `reauth_required`,
    `insufficient_scope`, `cookie_session_required`, `api_token_limit`).

    **Route guards.** Resource routes require a full session; while an admin-forced
    2FA enrolment is pending only `/auth/*` and `/me/security/*` are reachable
    (others answer 403 `totp_enrollment_required`).

    **Hosts.** The panel (SPA + `/api/v1/*`) may be served from an admin host
    (`RDPANEL_ADMIN_URL`) different from the public client-API host
    (`RDPANEL_PUBLIC_URL`); OIDC flows hand off between them (see
    `/auth/oidc/{slug}/start`).

    **Passkeys (WebAuthn).** Panel login only (RustDesk clients cannot do
    WebAuthn; use an OIDC IdP with passkeys, e.g. Pocket ID or Authentik). The
    relying party id and allowed origins come from `RDPANEL_ADMIN_URL` (fallback
    `RDPANEL_PUBLIC_URL`), overridable with `RDPANEL_WEBAUTHN_RP_ID` /
    `RDPANEL_WEBAUTHN_ORIGINS`. Every ceremony is two calls: `.../begin` returns
    `{ceremony_id, options}` where `options` is the JSON form of
    `CredentialCreationOptions`/`CredentialRequestOptions` (`{publicKey: ...}`,
    binary fields base64url); the SPA calls `navigator.credentials.create/get`
    and posts the JSON-serialised `PublicKeyCredential` to `.../finish`.
    Ceremonies are single use and expire after 5 minutes.

    **Timestamps** are RFC 3339 UTC strings. **Ids** are integers.

    **Pagination.** List endpoints take `page` (1-based) and `page_size` (default 50,
    max 500) and return `{"items": [...], "total": N, "page": P, "page_size": S}`.
    `sort` is a field name, prefixed with `-` for descending (allowed values are
    enumerated per endpoint). `q` is a case-insensitive substring search.

    **Scoping.** Endpoints tagged for both roles (devices, address books, audit
    logins, lookups) are scoped server-side: a `user` only ever sees their own
    devices, books they own or that are shared with them, and their own login
    events. Admin-only endpoints return 403 `forbidden` for the `user` role.

    **Live events.** `GET /api/v1/events` (outside this base path) is a
    Server-Sent Events stream, see the `/events` path and `x-sse-events`.

    **Interactive docs.** Swagger UI for this contract is served at `/api/v1/docs`
    (`RDPANEL_API_DOCS`: `auth` default, `public`, `off`); the spec itself at
    `/api/v1/openapi.yaml` / `.json`.

    Every `/api/v1/admin` route is listed here; `internal/app/openapi_test.go`
    walks the real router and fails on any difference.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1/admin
security:
  - sessionCookie: []
  - bearerAuth: []
tags:
  - name: auth
  - name: security
  - name: identity-providers
  - name: dashboard
  - name: about
  - name: users
  - name: groups
  - name: devices
  - name: address-books
  - name: audit
  - name: server
  - name: relays
  - name: settings
  - name: lookup
  - name: events
  - name: docs
x-sse-events:
  description: |
    `GET /api/v1/events` — `text/event-stream`, session-authenticated (same cookie, or a Bearer API token),
    no CSRF (GET). The server sends a comment line `: ping` every 25 s and sets
    `retry: 3000`. Clients reconnect with exponential backoff (1 s → 30 s, jitter)
    and refetch lists after a reconnect because events are not replayed
    (`Last-Event-ID` is ignored in v1). `user`-role sessions receive only events
    about their own devices and connections; `hbbs.health` and `relay.health` go to admins only.
    Every event's `data:` is one JSON object.
  events:
    presence.changed: { $ref: "#/components/schemas/PresenceChangedEvent" }
    device.updated: { $ref: "#/components/schemas/Device" }
    audit.connection: { $ref: "#/components/schemas/ConnectionAudit" }
    hbbs.health: { $ref: "#/components/schemas/ServerHealth" }
    relay.health: { $ref: "#/components/schemas/RelayHealthEvent" }
paths:
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrf
      summary: Issue (or re-issue) the CSRF token and set the rdpanel_csrf cookie.
      security: []
      responses:
        "200":
          description: CSRF token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login (optionally with a TOTP or recovery code).
      description: |
        On success rotates the session (any presented session is revoked), sets the
        session and CSRF cookies and returns `{mfa_required: false, me}`.
        When the user has TOTP enabled and no `totp_code` was given, a short-lived
        (5 min) pending session is issued and the response is `{mfa_required: true}`;
        finish with `POST /auth/mfa`. Errors are generic (401 `invalid_credentials`)
        whether the user exists or not; 403 `password_login_disabled` when password
        sign-in is turned off for the `user` role (Settings → auth). Failed attempts
        are rate limited per IP and per username with exponential backoff
        (429 `rate_limited`, `Retry-After`).
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in, or password accepted and second factor required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session and clear cookies.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The currently authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/mfa:
    post:
      tags: [auth]
      operationId: completeMfa
      summary: Complete a pending login with a TOTP code or a recovery code.
      description: |
        Requires the short-lived pending session issued by `/auth/login` (or by an
        OIDC login of a user with TOTP, which lands on `/login?mfa=1&next=…`).
        Rotates the session.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Logged in (`mfa_required` is false, `me` is set).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/mfa/resend:
    post:
      tags: [auth]
      operationId: resendMfaEmail
      summary: E-mail a new sign-in code for a pending e-mail login.
      description: |
        Requires the pending session of a login whose second factor is an e-mailed
        code (`mfa_method: email`). The previous code is invalidated. Limited by a
        60 s cooldown and hourly caps (429 `rate_limited`, `Retry-After`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Code sent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: The e-mail could not be sent (`email_send_failed`). }
  /auth/options:
    get:
      tags: [auth]
      operationId: getAuthOptions
      summary: Optional login-page features.
      security: []
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOptions" }
  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password reset link by e-mail.
      description: |
        `login` is a username or an e-mail address. The answer is always 202,
        whether or not an account matched; the e-mail is sent in the background
        only to active accounts with a password and a **verified** address that may
        use password sign-in. The link (`<admin_url>/reset-password?token=…`) is
        single-use and valid 30 minutes. 409 `password_reset_unavailable` when SMTP
        or the panel URL is not configured. Requests are rate limited per IP.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: Accepted (identical for unknown accounts).
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPasswordByEmail
      summary: Set a new password with a reset token from the e-mail.
      description: |
        Consumes the token, sets the password and revokes every panel session and
        client token of the user (the browser's session cookie is cleared too).
        400 `invalid_token` for unknown, used or expired tokens.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password changed; sign in again. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/providers:
    get:
      tags: [auth]
      operationId: listLoginProviders
      summary: Enabled identity providers for the login page buttons.
      security: []
      responses:
        "200":
          description: Providers (empty when OIDC is unavailable, e.g. no public URL).
          content:
            application/json:
              schema:
                type: object
                required: [items, passkey]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LoginProvider" } }
                  passkey: { type: boolean, description: '"Sign in with a passkey" is available (WebAuthn relying party configured).' }
  /auth/passkey/begin:
    post:
      tags: [auth]
      operationId: beginPasskeyLogin
      summary: Start a usernameless passkey sign-in (discoverable credential, user verification required).
      description: |
        Returns request options without `allowCredentials`; the authenticator picks
        the account. 409 `passkeys_unavailable` when no relying party is configured;
        429 when the IP is backing off after failures (shared with password login)
        or too many sign-ins are pending.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Ceremony.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/passkey/finish:
    post:
      tags: [auth]
      operationId: finishPasskeyLogin
      summary: Complete a usernameless passkey sign-in.
      description: |
        Verifies the assertion (origin, RP id, signature, user verification, user
        handle) and issues a full session: a verified passkey satisfies 2FA by
        itself (`mfa_required` is always false). A signature counter that did not
        advance flags the passkey as possibly cloned (`clone_warning`) and the
        sign-in is refused until the user removes it. Failures answer 401
        `passkey_failed`, are logged as `passkey` login events and count toward
        the per-IP/per-user backoff of password login.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyFinishRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/mfa/passkey/begin:
    post:
      tags: [auth]
      operationId: beginPasskeyMfa
      summary: Start a passkey second factor for the pending login (instead of TOTP).
      description: |
        Requires the pending session of `/auth/login` or an OIDC login. Lists the
        user's passkeys in `allowCredentials` (user verification preferred).
        409 `no_passkeys` when the user has none.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Ceremony.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/mfa/passkey/finish:
    post:
      tags: [auth]
      operationId: finishPasskeyMfa
      summary: Complete the pending login with a passkey assertion. Rotates the session.
      description: The ceremony is bound to the pending session that started it.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyFinishRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/oidc/{slug}/start:
    post:
      tags: [auth]
      operationId: startOidcLogin
      summary: Begin a panel login with an identity provider.
      description: |
        Sets an HttpOnly browser-binding cookie (`rdpanel_oauth`, admin host) and
        returns the IdP URL; the SPA navigates to it (`window.location`). The IdP
        redirects to `<public_url>/api/oidc/callback` (the only redirect URI
        registered at the IdP, possibly on another host), which exchanges the code
        and hands off to `<admin_url>/api/v1/admin/auth/oidc/complete`. The browser
        finally lands on `next` on success; `/login?mfa=1&next=<next>` when TOTP is
        enabled (finish with `POST /auth/mfa`); `/login?error=oidc_<code>` on
        failure, where code is one of `expired`, `denied`, `failed`, `no_account`,
        `disabled`, `ambiguous`, `already_linked`, `session_mismatch`.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcStartRequest" }
      responses:
        "200":
          description: IdP authorization URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { description: Identity provider unavailable (`provider_unavailable`). }
  /auth/oidc/complete:
    get:
      tags: [auth]
      operationId: completeOidc
      summary: Admin-host end of a panel OIDC login or identity link (browser navigation).
      description: |
        Target of the 302 from `/api/oidc/callback`. Consumes the single-use ticket
        (valid 2 minutes), verifies the `rdpanel_oauth` binding cookie against the
        flow in constant time, then creates the session (or links the identity) and
        redirects into the SPA: `next`, `/login?mfa=1&next=…`, `/login?error=oidc_<code>`,
        or for linking `<next>?linked=<slug>` / `<next>?link_error=<code>`
        (default `/my/profile`). Never answers JSON.
      security: []
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect into the SPA. }
  /me:
    patch:
      tags: [security]
      operationId: updateMyProfile
      summary: Edit my display name and email.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/security:
    get:
      tags: [security]
      operationId: getMySecurity
      summary: 2FA / password state of the current user.
      description: Reachable while a forced 2FA enrolment is pending (as are all /me/security routes).
      responses:
        "200":
          description: Security overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security/totp/enroll:
    post:
      tags: [security]
      operationId: enrollTotp
      summary: Start (or restart) TOTP enrolment; returns the seed and otpauth URI (render it as a QR code).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: New pending seed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/security/totp/confirm:
    post:
      tags: [security]
      operationId: confirmTotp
      summary: Confirm enrolment with a code; returns recovery codes (shown once).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: 2FA enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/totp/disable:
    post:
      tags: [security]
      operationId: disableTotp
      summary: Disable 2FA (requires the password or a TOTP/recovery code).
      description: Refused with 403 `totp_required` when policy requires 2FA for this account.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/recovery-codes:
    post:
      tags: [security]
      operationId: regenerateRecoveryCodes
      summary: Replace recovery codes (requires the password or a TOTP code); shown once.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "200":
          description: New codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/email/verify:
    post:
      tags: [security]
      operationId: sendEmailVerification
      summary: E-mail a 6-digit verification code to my address (valid 10 min).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Code sent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`email_not_configured`, `no_email` or `already_verified`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: The e-mail could not be sent (`email_send_failed`). }
  /me/security/email/confirm:
    post:
      tags: [security]
      operationId: confirmEmailVerification
      summary: Confirm my address with the e-mailed code.
      description: The code applies only while the address is unchanged. Changing the address clears verification and e-mail 2FA.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityOverview" }
        "400": { description: Invalid or expired code (`code_invalid`). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/email-2fa:
    put:
      tags: [security]
      operationId: setEmail2fa
      summary: Turn e-mailed sign-in codes on or off.
      description: |
        Enabling needs a verified address and configured SMTP (409 `email_not_verified`,
        `email_not_configured`). Disabling needs the password or a TOTP/recovery code
        (unless the account has neither) and is refused (403 `email_2fa_required`)
        while the admin policy requires e-mail codes and TOTP is off. The factor applies
        when TOTP is not enrolled, to panel and RustDesk client logins.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Email2faRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/sessions:
    get:
      tags: [security]
      operationId: listMySessions
      summary: Active panel sessions and client tokens of the current user.
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security/sessions/revoke-others:
    post:
      tags: [security]
      operationId: revokeMyOtherSessions
      summary: Revoke every session and client token except the current session.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Number of revoked sessions/tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security/sessions/{id}:
    delete:
      tags: [security]
      operationId: revokeMySession
      summary: Revoke one of my sessions or client tokens.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/api-tokens:
    get:
      tags: [security]
      operationId: listMyApiTokens
      summary: My personal API tokens (not revoked; expired ones flagged).
      responses:
        "200":
          description: Tokens, newest first. Never contains the secret.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [security]
      operationId: createMyApiToken
      summary: Create a personal API token; the secret is returned once.
      description: |
        Requires a cookie session (an API token cannot mint tokens: 403
        `cookie_session_required`). At most 50 tokens per user (409 `api_token_limit`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiTokenRequest" }
      responses:
        "201":
          description: Created. `token` is shown only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/api-tokens/{token_id}:
    delete:
      tags: [security]
      operationId: revokeMyApiToken
      summary: Revoke one of my API tokens (cookie session only).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/ApiTokenId"
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/security/password:
    post:
      tags: [security]
      operationId: changeMyPassword
      summary: Change password; revokes every other session and client token.
      description: "`current_password` is required when the account has a password (401 `reauth_failed` when wrong)."
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/identities:
    get:
      tags: [security]
      operationId: listMyIdentities
      summary: Identities (GitHub, Google, OIDC) linked to my account.
      responses:
        "200":
          description: Linked identities.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UserIdentity" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security/identities/{id}:
    delete:
      tags: [security]
      operationId: unlinkMyIdentity
      summary: Unlink an identity (409 when it is the last sign-in method).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Unlinked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/security/identities/link/{slug}:
    post:
      tags: [security]
      operationId: linkMyIdentity
      summary: Begin linking an identity of provider {slug}.
      description: |
        Returns the IdP URL to navigate to (same hand-off as `/auth/oidc/{slug}/start`).
        The browser ends on `next` (default `/my/profile`) with `?linked=<slug>` or
        `?link_error=<code>`.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcStartRequest" }
      responses:
        "200":
          description: IdP authorization URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/security/passkeys:
    get:
      tags: [security]
      operationId: listMyPasskeys
      summary: My passkeys (panel sign-in).
      responses:
        "200":
          description: Passkeys, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Passkey" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security/passkeys/register/begin:
    post:
      tags: [security]
      operationId: beginPasskeyRegistration
      summary: Start adding a passkey (requires re-authentication).
      description: |
        Re-authenticate with the password or a TOTP/recovery code (401
        `reauth_failed`). Accounts with neither (OIDC-only) may add a passkey only
        within 10 minutes of signing in (401 `reauth_required` otherwise).
        Requests a discoverable credential; already registered authenticators are
        excluded. 409 `passkey_limit` beyond 20 passkeys, `passkeys_unavailable`
        when no relying party is configured.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "200":
          description: Ceremony.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/passkeys/register/finish:
    post:
      tags: [security]
      operationId: finishPasskeyRegistration
      summary: Store the new passkey (ceremony bound to the session that began it).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyRegisterFinishRequest" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/security/passkeys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [security]
      operationId: renameMyPasskey
      summary: Rename one of my passkeys.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyRename" }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [security]
      operationId: deleteMyPasskey
      summary: Remove one of my passkeys.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /identity-providers:
    get:
      tags: [identity-providers]
      operationId: listIdentityProviders
      summary: All identity providers (admin). Secrets are never returned.
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/IdentityProvider" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [identity-providers]
      operationId: createIdentityProvider
      summary: Create an identity provider (admin).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /identity-providers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [identity-providers]
      operationId: getIdentityProvider
      summary: One identity provider (admin).
      responses:
        "200":
          description: Provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [identity-providers]
      operationId: updateIdentityProvider
      summary: Update an identity provider (admin); omitted fields keep their value, omitted/null `client_secret` keeps the secret.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [identity-providers]
      operationId: deleteIdentityProvider
      summary: Delete an identity provider and its linked identities (admin).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /identity-providers/{id}/test:
    post:
      tags: [identity-providers]
      operationId: testIdentityProvider
      summary: Run OIDC discovery for the provider and report the endpoints (admin).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Result (`ok=false` with `error` on failure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── stream D: resources ─────────────────────────────

  /branding:
    get:
      tags: [settings]
      operationId: getBranding
      summary: Public branding (title, logo, welcome text) for the login page and shell.
      security: []
      responses:
        "200":
          description: Branding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
  /branding/logo:
    get:
      tags: [settings]
      operationId: getBrandingLogo
      summary: The uploaded logo image (404 when none).
      security: []
      responses:
        "200":
          description: Logo bytes.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Overview counters, 24 h series and server health.
      description: For the `user` role the device/connection counters cover only their own devices and `health` is null.
      responses:
        "200":
          description: Dashboard data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /about:
    get:
      tags: [about]
      operationId: getAbout
      summary: Panel version, bundled hbbs/hbbr source and the release update check.
      description: |
        Any signed-in user. `server` (process, database and hbbs/hbbr details) is null for the `user` role,
        and so is `update.error`. The update check runs server-side against the GitHub releases API, is
        cached for 6 h (failures are retried after 30 min) and is off with `RDPANEL_UPDATE_CHECK=false`.
      responses:
        "200":
          description: About data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/About" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /lookup/users:
    get:
      tags: [lookup]
      operationId: lookupUsers
      summary: Minimal user directory for pickers (owner, share grantee).
      description: Any authenticated user; returns at most 20 active users matching `q`.
      parameters:
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /lookup/user-groups:
    get:
      tags: [lookup]
      operationId: lookupUserGroups
      summary: Minimal user-group directory for pickers.
      parameters:
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: Matching groups.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/GroupRef" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List devices (admins see all, users see their own).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          schema:
            type: string
            default: -last_seen_at
            enum: [rustdesk_id, -rustdesk_id, hostname, -hostname, alias, -alias, os, -os, client_version, -client_version, last_seen_at, -last_seen_at, created_at, -created_at, online, -online]
        - $ref: "#/components/parameters/DeviceOnline"
        - $ref: "#/components/parameters/DeviceOwner"
        - $ref: "#/components/parameters/DeviceGroupFilter"
        - $ref: "#/components/parameters/DeviceOs"
        - $ref: "#/components/parameters/DeviceVersion"
        - $ref: "#/components/parameters/DeviceSeenAfter"
      responses:
        "200":
          description: Page of devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /devices/facets:
    get:
      tags: [devices]
      operationId: getDeviceFacets
      summary: Distinct OS families and client versions (with counts) for filter menus.
      responses:
        "200":
          description: Facets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceFacets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /devices/export.csv:
    get:
      tags: [devices]
      operationId: exportDevicesCsv
      summary: CSV export of all devices matching the same filters as the list (no paging).
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/DeviceOnline"
        - $ref: "#/components/parameters/DeviceOwner"
        - $ref: "#/components/parameters/DeviceGroupFilter"
        - $ref: "#/components/parameters/DeviceOs"
        - $ref: "#/components/parameters/DeviceVersion"
        - $ref: "#/components/parameters/DeviceSeenAfter"
      responses:
        "200":
          description: |
            `Content-Disposition: attachment; filename="devices-<date>.csv"`. Columns:
            rustdesk_id,alias,hostname,os,client_version,owner,group,online,last_seen_at,last_seen_ip,note.
            Cells starting with `= + - @` are prefixed with `'` (CSV injection).
          content:
            text/csv: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /devices/bulk:
    post:
      tags: [devices]
      operationId: bulkDevices
      summary: Bulk action on devices (admin).
      description: |
        `assign_owner` (owner_user_id, null = unassign), `assign_group` (device_group_id, null = none),
        `kick` (heartbeat `disconnect`), `delete` (also revokes client tokens bound to the device uuid).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceBulkRequest" }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [devices]
      operationId: getDevice
      summary: Device detail incl. recent connections.
      responses:
        "200":
          description: Device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Update alias, note, owner or group. Users may only edit alias/note of their own devices.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpdate" }
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Delete a device (admin); revokes client tokens bound to it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{device_id}/kick:
    post:
      tags: [devices]
      operationId: kickDevice
      summary: Ask the client to disconnect active sessions on its next heartbeat (admin).
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202": { description: Queued. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (admin).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          schema:
            type: string
            default: username
            enum: [username, -username, created_at, -created_at, last_login_at, -last_login_at, role, -role]
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: user_group_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user (admin).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
