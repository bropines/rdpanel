        "503": { $ref: "#/components/responses/Unavailable" }
  /server/ip-changes:
    get:
      tags: [server]
      operationId: listIpChanges
      summary: hbbs `ip-changes` table — ids that registered from several IPs (admin).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpChangesPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /server/ip-changes/{rustdesk_id}:
    delete:
      tags: [server]
