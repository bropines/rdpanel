    ComponentHealth:
      type: object
      required: [status, checked_at]
      properties:
        status: { type: string, enum: [up, down, unknown] }
        address: { type: string, description: "e.g. 127.0.0.1:21115" }
        latency_ms: { type: [integer, "null"] }
        checked_at: { type: string, format: date-time }
        up_since: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
    ServerHealth:
      type: object
      required: [hbbs, hbbr, presence]
      properties:
        hbbs: { $ref: "#/components/schemas/ComponentHealth" }
        hbbr: { $ref: "#/components/schemas/ComponentHealth" }
        presence:
          type: object
          required: [source, devices_online]
          properties:
            source: { type: string, enum: [hbbs, heartbeat], description: heartbeat = fallback while hbbs is down. }
            last_poll_at: { type: [string, "null"], format: date-time }
            poll_duration_ms: { type: [integer, "null"] }
            devices_online: { type: integer }
        settings_in_sync: { type: boolean, description: False when a desired server setting differs from the applied value. }
    ServerSettingsValues:
      type: object
      description: hbbs/hbbr runtime settings. In `applied`, null = could not be read.
      properties:
        relay_servers: { type: [array, "null"], items: { type: string } }
        always_use_relay: { type: [boolean, "null"] }
        must_login: { type: [boolean, "null"] }
        tcp_keepalive:
          type: [boolean, "null"]
          description: |
            TCP_KEEPALIVE (bropines/rustdesk-server fork): hbbs sends an empty frame every 12 s on registered
            TCP/WebSocket rendezvous connections so clients in TCP/WebSocket mode stay online. In `applied`,
            null also means the running hbbs does not support the command.
        webrtc:
          type: [boolean, "null"]
          description: |
            WEBRTC (bropines/rustdesk-server fork): hbbs forwards WebRTC signaling (SDP offer/answer, trickle ICE)
            between RustDesk 1.5+ clients; see docs/webrtc.md. In `applied`, null also means the running hbbs does
            not support the command.
        blacklist: { type: [array, "null"], items: { type: string }, description: hbbr throttled IPs. }
        blocklist: { type: [array, "null"], items: { type: string }, description: hbbr refused IPs. }
        limit_speed_mbps: { type: [number, "null"], description: Speed for blacklisted/downgraded relays (Mibit/s). }
        total_bandwidth_mbps: { type: [number, "null"] }
        single_bandwidth_mbps: { type: [number, "null"] }
        downgrade_threshold: { type: [number, "null"] }
        downgrade_start_check_s: { type: [integer, "null"] }
    ServerSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        relay_servers: { type: array, maxItems: 32, items: { type: string, pattern: "^[^\\s,]+$" } }
        always_use_relay: { type: boolean }
        must_login: { type: boolean }
        tcp_keepalive: { type: boolean }
        webrtc: { type: boolean }
        blacklist: { type: array, maxItems: 10000, items: { type: string } }
        blocklist: { type: array, maxItems: 10000, items: { type: string } }
        limit_speed_mbps: { type: number, exclusiveMinimum: 0 }
        total_bandwidth_mbps: { type: number, exclusiveMinimum: 0 }
        single_bandwidth_mbps: { type: number, exclusiveMinimum: 0 }
        downgrade_threshold: { type: number, exclusiveMinimum: 0 }
        downgrade_start_check_s: { type: integer, minimum: 1 }
    ClientConfig:
      type: object
      required: [id_server, relay_server, api_server, public_key, config_string]
      description: Connection settings and encoded configuration string for RustDesk clients.
      properties:
        id_server:
          type: string
          description: Host or address of the hbbs ID server.
        relay_server:
          type: string
          description: Host or address of the hbbr relay server.
        api_server:
          type: string
          description: Public API URL for clients.
        public_key:
          type: string
          description: Server public key from id_ed25519.pub.
        config_string:
          type: string
          description: Base64-encoded reversed JSON string for RustDesk's Import Server Config or --config.
        id_server_ip:
          type: string
          description: Resolved IPv4 address of the hbbs ID server, if different from id_server.
        relay_server_ip:
          type: string
          description: Resolved IPv4 address with port of the hbbr relay server, if different from relay_server.
        config_string_ip:
          type: string
          description: Base64-encoded configuration string with resolved IP addresses.
    ClientOptions:
      type: object
      required: [ice_servers, webrtc_congestion_control, pushed, modified_at]
      description: |
        RustDesk client options pushed to every device in heartbeat responses (strategy `config_options`).
        Nothing is pushed until they are saved once; after that every key is pushed, an empty value removing
        it on the client (client default).
      properties:
        ice_servers:
          type: string
          description: |
            `ice-servers`: STUN/TURN servers for the WebRTC transport (RustDesk 1.5+), one per line.
            TURN entries carry credentials (`turn://user:pass@host:port`). Empty = RustDesk's default STUN.
        webrtc_congestion_control:
          type: [boolean, "null"]
          description: "`allow-webrtc-congestion-control`; null = client default."
        pushed: { type: boolean, description: True once saved (clients receive the keys). }
        modified_at: { type: [string, "null"], format: date-time, description: Version clients echo back. }
    ClientOptionsInput:
      type: object
      additionalProperties: false
      properties:
        ice_servers:
          type: string
          maxLength: 16384
          description: stun:, stuns:, turn:// or turns:// URLs separated by commas or newlines (at most 16).
        webrtc_congestion_control: { type: [boolean, "null"] }
    ServerSettingKey:
      type: string
      enum: [relay_servers, always_use_relay, must_login, tcp_keepalive, webrtc, blacklist, blocklist, limit_speed_mbps, total_bandwidth_mbps, single_bandwidth_mbps, downgrade_threshold, downgrade_start_check_s]
    ServerSettingStatus:
      type: object
      required: [key, target, in_sync]
      properties:
        key: { $ref: "#/components/schemas/ServerSettingKey" }
        target: { type: string, enum: [hbbs, hbbr] }
        in_sync: { type: boolean }
        managed: { type: boolean, description: False when no desired value is stored (server default/env applies). }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: [string, "null"] }
        applied_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
    ServerSettingsState:
      type: object
      required: [desired, applied, keys]
      properties:
        desired: { $ref: "#/components/schemas/ServerSettingsValues" }
        applied: { $ref: "#/components/schemas/ServerSettingsValues" }
        keys: { type: array, items: { $ref: "#/components/schemas/ServerSettingStatus" } }
        checked_at: { type: [string, "null"], format: date-time }
    IpBlockerEntry:
