openapi: 3.1.0
info:
  title: rustdesk-panel admin API
  version: 0.1.0
  summary: Panel JSON API consumed by the embedded React SPA.
  description: |
    Contract between the backend (`internal/adminapi`) and the web UI (`web/`).
    Regenerate the TypeScript types with `npm run gen:api` (in `web/`).

    **Authentication.** Cookie session: `rdpanel_session` (HttpOnly, SameSite=Lax,
    Secure on https) holding an opaque token (sha256 stored server-side, kind `web`),
    12 h idle / 7 d absolute.

    **CSRF.** Double submit: every non-GET request must send header `X-CSRF-Token`
    equal to the `rdpanel_csrf` cookie (obtain/refresh it with `GET /auth/csrf`).

    **Errors.** Every non-2xx response has the body `{"error":{"code","message"}}`.
    `code` is stable and machine-readable (`unauthorized`, `forbidden`, `csrf_failed`,
    `not_found`, `conflict`, `validation_failed`, `rate_limited`, `totp_required`,
    `totp_invalid`, `internal`, `invalid_credentials`, `totp_enrollment_required`,
    `reauth_failed`, `oidc_not_configured`, `provider_unavailable`).

    **Route guards.** Resource routes require a full session; while an admin-forced
    2FA enrolment is pending only `/auth/*` and `/me/security/*` are reachable
    (others answer 403 `totp_enrollment_required`).

    **Timestamps** are RFC 3339 UTC strings. **Ids** are integers.

    Status: skeleton by stream F; stream B completes resources and endpoints.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1/admin
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: security
  - name: identity-providers
  - name: users
  - name: devices
  - name: address-books
paths:
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrf
      summary: Issue (or re-issue) the CSRF token and set the rdpanel_csrf cookie.
      security: []
      responses:
        "200":
          description: CSRF token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login (optionally with a TOTP or recovery code).
      description: |
        On success rotates the session (any presented session is revoked), sets the
        session and CSRF cookies and returns `{mfa_required: false, me}`.
        When the user has TOTP enabled and no `totp_code` was given, a short-lived
        (5 min) pending session is issued and the response is `{mfa_required: true}`;
        finish with `POST /auth/mfa`. Errors are generic (`invalid_credentials`)
        whether the user exists or not. Failed attempts are rate limited per IP and
        per username with exponential backoff (429 `rate_limited`, `Retry-After`).
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in, or password accepted and second factor required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session (if any) and clear the session cookie. Idempotent.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Logged out. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/mfa:
    post:
      tags: [auth]
      operationId: completeMfa
      summary: Complete a pending login with a TOTP code or a recovery code.
      description: Requires the pending session issued by `/auth/login` (or an OIDC login of a user with TOTP). Rotates the session.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/providers:
    get:
      tags: [auth]
      operationId: listLoginProviders
      summary: Enabled identity providers for the login page buttons.
      security: []
      responses:
        "200":
          description: Providers (empty when OIDC is unavailable).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoginProvider" }
  /auth/oidc/{slug}/start:
    post:
      tags: [auth]
      operationId: startOidcLogin
      summary: Begin a panel login with an identity provider.
      description: |
        Sets an HttpOnly browser-binding cookie and returns the IdP URL; the SPA must
        navigate to it (`window.location`). The IdP redirects to `/api/oidc/callback`,
        which then redirects the browser to:
        `next` on success; `/login?mfa=1&next=<next>` when TOTP is enabled (finish with
        `POST /auth/mfa`); `/login?error=oidc_<code>` on failure, where code is one of
        `expired`, `denied`, `failed`, `no_account`, `disabled`, `ambiguous`,
        `already_linked`, `session_mismatch`.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcStartRequest" }
      responses:
        "200":
          description: IdP authorization URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/security:
    get:
      tags: [security]
      operationId: getMySecurity
      summary: 2FA / password state of the current user.
      description: Reachable while a forced 2FA enrolment is pending (as are all /me/security routes).
      responses:
        "200":
          description: Security overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security/totp/enroll:
    post:
      tags: [security]
      operationId: enrollTotp
      summary: Start (or restart) TOTP enrolment; returns the seed and otpauth URI (render it as a QR code).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: New pending seed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/security/totp/confirm:
    post:
      tags: [security]
      operationId: confirmTotp
      summary: Confirm enrolment with a code; returns recovery codes (shown once).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: 2FA enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/totp/disable:
    post:
      tags: [security]
      operationId: disableTotp
      summary: Disable 2FA (requires the password or a TOTP/recovery code).
      description: Refused with 403 `totp_required` when policy requires 2FA for this account.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/recovery-codes:
    post:
      tags: [security]
      operationId: regenerateRecoveryCodes
      summary: Replace recovery codes (requires the password or a TOTP code); shown once.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "200":
          description: New codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/sessions:
    get:
      tags: [security]
      operationId: listMySessions
      summary: Active panel sessions and client tokens of the current user.
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security/sessions/{id}:
    delete:
      tags: [security]
      operationId: revokeMySession
      summary: Revoke one of my sessions or client tokens.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/security/password:
    post:
      tags: [security]
      operationId: changeMyPassword
      summary: Change password; revokes every other session and client token.
      description: "`current_password` is required when the account has a password."
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/security/identities:
    get:
      tags: [security]
      operationId: listMyIdentities
      summary: Identities (GitHub, Google, OIDC) linked to my account.
      responses:
        "200":
          description: Linked identities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LinkedIdentity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security/identities/{id}:
    delete:
      tags: [security]
      operationId: unlinkMyIdentity
      summary: Unlink an identity (409 when it is the last sign-in method).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Unlinked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/security/identities/link/{slug}:
    post:
      tags: [security]
      operationId: linkMyIdentity
      summary: Begin linking an identity of provider {slug}.
      description: |
        Returns the IdP URL to navigate to. After the IdP the browser is redirected to
        `next` (default `/my/security`) with `?linked=<slug>` or `?link_error=<code>`.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcStartRequest" }
      responses:
        "200":
          description: IdP authorization URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /identity-providers:
    get:
      tags: [identity-providers]
      operationId: listIdentityProviders
      summary: All identity providers (admin). Secrets are never returned.
      responses:
        "200":
          description: Providers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IdentityProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [identity-providers]
      operationId: createIdentityProvider
      summary: Create an identity provider (admin).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /identity-providers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [identity-providers]
      operationId: getIdentityProvider
      summary: One identity provider (admin).
      responses:
        "200":
          description: Provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [identity-providers]
      operationId: updateIdentityProvider
      summary: Replace an identity provider (admin). Omit `client_secret` to keep it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdentityProviderInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvider" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [identity-providers]
      operationId: deleteIdentityProvider
      summary: Delete an identity provider and its linked identities (admin).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /identity-providers/{id}/test:
    post:
      tags: [identity-providers]
      operationId: testIdentityProvider
      summary: Run OIDC discovery for the provider and report the endpoints (admin).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Result (ok=false with error on failure).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The currently authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rdpanel_session
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the rdpanel_csrf cookie.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Unauthorized:
      description: Not authenticated (or session expired).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not allowed, or CSRF check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Uniqueness conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Request body or parameters are invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many failed attempts.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              examples: [unauthorized]
            message:
              type: string
              examples: [authentication required]
            fields:
              type: object
              description: Per-field validation messages (validation_failed only).
              additionalProperties: { type: string }
    CsrfToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 1024 }
        totp_code:
          type: string
          description: 6-digit TOTP code or a recovery code.
    LoginResponse:
      type: object
      required: [mfa_required]
      properties:
        mfa_required:
          type: boolean
          description: True when the password was accepted and POST /auth/mfa must follow.
        me: { $ref: "#/components/schemas/Me" }
    CodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, description: 6-digit TOTP code or a recovery code (xxxx-xxxx-xxxx-xxxx). }
    ReauthRequest:
      type: object
      additionalProperties: false
      description: Provide the current password or a TOTP/recovery code.
      properties:
        password: { type: string }
        code: { type: string }
    ChangePasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 1024 }
    LoginProvider:
      type: object
      required: [slug, display_name, kind]
      properties:
        slug: { type: string }
        display_name: { type: string }
        kind: { $ref: "#/components/schemas/ProviderKind" }
    OidcStartRequest:
      type: object
      additionalProperties: false
      properties:
        next:
          type: string
          description: Relative path to return to (anything else falls back to the default).
    UrlResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    SecurityOverview:
      type: object
      required: [has_password, totp_enabled, totp_pending, totp_required, must_enroll_totp, recovery_codes_remaining]
      properties:
        has_password: { type: boolean }
        totp_enabled: { type: boolean }
        totp_pending: { type: boolean, description: An unconfirmed enrolment exists. }
        totp_required: { type: boolean, description: Policy (user flag or admin policy) requires 2FA. }
        must_enroll_totp: { type: boolean }
        recovery_codes_remaining: { type: integer }
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 seed for manual entry. }
        otpauth_uri: { type: string, description: otpauth://totp/... URI to render as a QR code. }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          description: Shown once; only hashes are stored.
    LinkedIdentity:
      type: object
      required: [id, provider_id, provider_slug, provider_display_name, provider_kind, subject, email_verified, username, display_name, avatar_url, created_at]
      properties:
        id: { type: integer, format: int64 }
        provider_id: { type: integer, format: int64 }
        provider_slug: { type: string }
        provider_display_name: { type: string }
        provider_kind: { type: string }
        subject: { type: string }
        email: { type: [string, "null"] }
        email_verified: { type: boolean }
        username: { type: string }
        display_name: { type: string }
        avatar_url: { type: string }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ProviderKind:
      type: string
      enum: [github, google, oidc]
    IdentityProvider:
      type: object
      required: [id, slug, kind, display_name, client_id, has_client_secret, scopes, pkce_enabled, pkce_method, auto_register, link_by_verified_email, enabled, sort_order, callback_url, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, description: Name clients see as oidc/<slug>. }
        kind: { type: string, enum: [github, google, oidc, linuxdo] }
        display_name: { type: string }
        client_id: { type: string }
        has_client_secret: { type: boolean, description: The secret itself is write-only. }
        issuer: { type: [string, "null"], description: OIDC only; Google is fixed to https://accounts.google.com. }
        scopes:
          type: array
          items: { type: string }
          description: Empty = defaults (openid profile email; GitHub read:user user:email).
        pkce_enabled: { type: boolean }
        pkce_method: { type: string, enum: [S256, plain] }
        auto_register: { type: boolean }
        link_by_verified_email:
          type: boolean
          description: Link to an existing user by email only when the IdP asserts email_verified.
        enabled: { type: boolean }
        sort_order: { type: integer }
        callback_url: { type: string, description: Redirect URI to register at the IdP ("" without public URL). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IdentityProviderInput:
      type: object
      required: [slug, kind, client_id]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
        kind: { $ref: "#/components/schemas/ProviderKind" }
        display_name: { type: string, maxLength: 128 }
        client_id: { type: string, maxLength: 512 }
        client_secret:
          type: [string, "null"]
          description: Omitted/null keeps the stored secret; empty string clears it.
        issuer: { type: string, description: Required for kind=oidc. }
        scopes: { type: array, items: { type: string } }
        pkce_enabled: { type: boolean, default: true }
        pkce_method: { type: string, enum: [S256, plain], default: S256 }
        auto_register: { type: boolean, default: false }
        link_by_verified_email: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
        sort_order: { type: integer, default: 0 }
    IdentityProviderTestResult:
      type: object
      required: [ok, callback_url]
      properties:
        ok: { type: boolean }
        error: { type: string }
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        userinfo_endpoint: { type: string }
        jwks_uri: { type: string }
        callback_url: { type: string }
    Role:
      type: string
      enum: [admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    User:
      type: object
      required: [id, username, display_name, role, status, has_password, totp_enabled, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: [string, "null"] }
        display_name: { type: string }
        avatar_url: { type: string }
        note: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/UserStatus" }
        user_group_id: { type: [integer, "null"], format: int64 }
        has_password: { type: boolean }
        totp_enabled: { type: boolean }
        totp_required: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Me:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        must_enroll_totp:
          type: boolean
          description: True when 2FA is required for this account but not yet enrolled.
    Session:
      type: object
      description: An active panel session or client token of a user.
      required: [id, kind, created_at, expires_at, current]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [client, web] }
        device_rustdesk_id: { type: [string, "null"] }
        device_uuid: { type: [string, "null"] }
        client_platform: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: True for the session making the request. }
    Device:
      type: object
      required: [id, rustdesk_id, online, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        rustdesk_id: { type: string }
        uuid: { type: [string, "null"] }
        hostname: { type: string }
        os: { type: string }
        cpu: { type: string }
        memory: { type: string }
        os_username: { type: string }
        client_version: { type: string }
        alias: { type: string }
        note: { type: string }
        owner_user_id: { type: [integer, "null"], format: int64 }
        device_group_id: { type: [integer, "null"], format: int64 }
        online: { type: boolean, description: Live presence (hbbs OnlineRequest, heartbeat fallback). }
        last_seen_at: { type: [string, "null"], format: date-time }
        last_seen_ip: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Permission:
      type: string
      enum: [read, read_write, full]
    AddressBook:
      type: object
      required: [id, guid, owner_user_id, name, is_personal, permission, entry_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        guid: { type: string }
        owner_user_id: { type: integer, format: int64 }
        name: { type: string }
        note: { type: string }
        is_personal: { type: boolean }
        permission:
          $ref: "#/components/schemas/Permission"
          description: Effective permission of the current user.
        entry_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Entry:
      type: object
      description: Address-book entry. Passwords/hashes are write-only (never returned).
      required: [id, address_book_id, rustdesk_id, tags, has_password, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        address_book_id: { type: integer, format: int64 }
        rustdesk_id: { type: string }
        alias: { type: string }
        os_username: { type: string }
        hostname: { type: string }
        platform: { type: string }
        login_name: { type: string }
        note: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        has_password: { type: boolean }
        force_always_relay: { type: boolean }
        rdp_port: { type: string }
        rdp_username: { type: string }
        same_server: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Tag:
      type: object
      required: [id, address_book_id, name, color_argb]
      properties:
        id: { type: integer, format: int64 }
        address_book_id: { type: integer, format: int64 }
        name: { type: string }
        color_argb:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Flutter ARGB uint32, e.g. 4288585374 (0xFF9E9E9E).
    Page:
      type: object
      description: Generic page envelope; stream B specialises per resource.
      required: [total, items]
      properties:
        total: { type: integer }
        items: { type: array, items: {} }
