          description: Health.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/settings:
    get:
      tags: [server]
      operationId: getServerSettings
      summary: Desired hbbs/hbbr settings, the values read back from the servers, and per-key sync state (admin).
      responses:
        "200":
          description: State.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettingsState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [server]
      operationId: updateServerSettings
      summary: Change desired settings (partial). The reconciler applies them immediately and on every hbbs/hbbr restart.
      description: |
        Validation: relay servers `host[:port]` without spaces; IPs/CIDRs via netip;
        speeds > 0. After `always_use_relay` the reconciler re-sends `relay-servers`
        (hbbs bug, see docs/research/hbbs-integration.md §1.3).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSettingsPatch" }
      responses:
        "200":
          description: New state (after one apply attempt).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettingsState" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /server/settings/reapply:
    post:
      tags: [server]
      operationId: reapplyServerSettings
      summary: Force the reconciler to re-apply every desired setting now (admin).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: State after re-applying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettingsState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
