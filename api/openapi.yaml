openapi: 3.1.0
info:
  title: rustdesk-panel admin API
  version: 0.1.0
  summary: Panel JSON API consumed by the embedded React SPA.
  description: |
    Contract between the backend (`internal/adminapi`) and the web UI (`web/`).
    Regenerate the TypeScript types with `npm run gen:api` (in `web/`).

    **Authentication.** Cookie session: `rdpanel_session` (HttpOnly, SameSite=Lax,
    Secure on https) holding an opaque token (sha256 stored server-side, kind `web`),
    12 h idle / 7 d absolute.

    **CSRF.** Double submit: every non-GET request must send header `X-CSRF-Token`
    equal to the `rdpanel_csrf` cookie (obtain/refresh it with `GET /auth/csrf`).

    **Errors.** Every non-2xx response has the body `{"error":{"code","message"}}`.
    `code` is stable and machine-readable (`unauthorized`, `forbidden`, `csrf_failed`,
    `not_found`, `conflict`, `validation_failed`, `rate_limited`, `totp_required`,
    `totp_invalid`, `internal`).

    **Timestamps** are RFC 3339 UTC strings. **Ids** are integers.

    **Pagination.** List endpoints take `page` (1-based) and `page_size` (default 50,
    max 500) and return `{"items": [...], "total": N, "page": P, "page_size": S}`.
    `sort` is a field name, prefixed with `-` for descending (allowed values are
    enumerated per endpoint). `q` is a case-insensitive substring search.

    **Scoping.** Endpoints tagged for both roles (devices, address books, audit
    logins, lookups) are scoped server-side: a `user` only ever sees their own
    devices, books they own or that are shared with them, and their own login
    events. Admin-only endpoints return 403 `forbidden` for the `user` role.

    **Live events.** `GET /api/v1/events` (outside this base path) is a
    Server-Sent Events stream, see the `/events` path and `x-sse-events`.

    Status: skeleton by stream F; stream D defined the resource endpoints the UI
    needs (dashboard … settings); stream B owns `/auth/*`, `/me/*` and
    `/identity-providers` and implements everything.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1/admin
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: dashboard
  - name: users
  - name: groups
  - name: devices
  - name: address-books
  - name: audit
  - name: server
  - name: settings
  - name: lookup
  - name: events
x-sse-events:
  description: |
    `GET /api/v1/events` — `text/event-stream`, session-authenticated (same cookie),
    no CSRF (GET). The server sends a comment line `: ping` every 25 s and sets
    `retry: 3000`. Clients reconnect with exponential backoff (1 s → 30 s, jitter)
    and refetch lists after a reconnect because events are not replayed
    (`Last-Event-ID` is ignored in v1). `user`-role sessions receive only events
    about their own devices and connections; `hbbs.health` goes to admins only.
    Every event's `data:` is one JSON object.
  events:
    presence.changed: { $ref: "#/components/schemas/PresenceChangedEvent" }
    device.updated: { $ref: "#/components/schemas/Device" }
    audit.connection: { $ref: "#/components/schemas/ConnectionAudit" }
    hbbs.health: { $ref: "#/components/schemas/ServerHealth" }
paths:
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrf
      summary: Issue (or re-issue) the CSRF token and set the rdpanel_csrf cookie.
      security: []
      responses:
        "200":
          description: CSRF token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login (optionally with a TOTP or recovery code).
      description: |
        On success sets the session cookie and returns the current user.
        When the user has 2FA enabled and no `totp_code` was given, responds
        401 with error code `totp_required`. Failed attempts are rate limited per
        IP and per username (429 `rate_limited`, `Retry-After` header).
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session and clear cookies.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The currently authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── stream D: resources ─────────────────────────────

  /branding:
    get:
      tags: [settings]
      operationId: getBranding
      summary: Public branding (title, logo, welcome text) for the login page and shell.
      security: []
      responses:
        "200":
          description: Branding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
  /branding/logo:
    get:
      tags: [settings]
      operationId: getBrandingLogo
      summary: The uploaded logo image (404 when none).
      security: []
      responses:
        "200":
          description: Logo bytes.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Overview counters, 24 h series and server health.
      description: For the `user` role the device/connection counters cover only their own devices and `health` is null.
      responses:
        "200":
          description: Dashboard data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /lookup/users:
    get:
      tags: [lookup]
      operationId: lookupUsers
      summary: Minimal user directory for pickers (owner, share grantee).
      description: Any authenticated user; returns at most 20 active users matching `q`.
      parameters:
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /lookup/user-groups:
    get:
      tags: [lookup]
      operationId: lookupUserGroups
      summary: Minimal user-group directory for pickers.
      parameters:
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: Matching groups.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/GroupRef" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List devices (admins see all, users see their own).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          schema:
            type: string
            default: -last_seen_at
            enum: [rustdesk_id, -rustdesk_id, hostname, -hostname, alias, -alias, os, -os, client_version, -client_version, last_seen_at, -last_seen_at, created_at, -created_at, online, -online]
        - $ref: "#/components/parameters/DeviceOnline"
        - $ref: "#/components/parameters/DeviceOwner"
        - $ref: "#/components/parameters/DeviceGroupFilter"
        - $ref: "#/components/parameters/DeviceOs"
        - $ref: "#/components/parameters/DeviceVersion"
        - $ref: "#/components/parameters/DeviceSeenAfter"
      responses:
        "200":
          description: Page of devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /devices/facets:
    get:
      tags: [devices]
      operationId: getDeviceFacets
      summary: Distinct OS families and client versions (with counts) for filter menus.
      responses:
        "200":
          description: Facets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceFacets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /devices/export.csv:
    get:
      tags: [devices]
      operationId: exportDevicesCsv
      summary: CSV export of all devices matching the same filters as the list (no paging).
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/DeviceOnline"
        - $ref: "#/components/parameters/DeviceOwner"
        - $ref: "#/components/parameters/DeviceGroupFilter"
        - $ref: "#/components/parameters/DeviceOs"
        - $ref: "#/components/parameters/DeviceVersion"
        - $ref: "#/components/parameters/DeviceSeenAfter"
      responses:
        "200":
          description: |
            `Content-Disposition: attachment; filename="devices-<date>.csv"`. Columns:
            rustdesk_id,alias,hostname,os,client_version,owner,group,online,last_seen_at,last_seen_ip,note.
            Cells starting with `= + - @` are prefixed with `'` (CSV injection).
          content:
            text/csv: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /devices/bulk:
    post:
      tags: [devices]
      operationId: bulkDevices
      summary: Bulk action on devices (admin).
      description: |
        `assign_owner` (owner_user_id, null = unassign), `assign_group` (device_group_id, null = none),
        `kick` (heartbeat `disconnect`), `delete` (also revokes client tokens bound to the device uuid).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceBulkRequest" }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      tags: [devices]
      operationId: getDevice
      summary: Device detail incl. recent connections.
      responses:
        "200":
          description: Device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Update alias, note, owner or group. Users may only edit alias/note of their own devices.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpdate" }
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [devices]
      operationId: deleteDevice
      summary: Delete a device (admin); revokes client tokens bound to it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{device_id}/kick:
    post:
      tags: [devices]
      operationId: kickDevice
      summary: Ask the client to disconnect active sessions on its next heartbeat (admin).
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202": { description: Queued. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (admin).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          schema:
            type: string
            default: username
            enum: [username, -username, created_at, -created_at, last_login_at, -last_login_at, role, -role]
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: user_group_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user (admin).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListItem" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: User detail (admin).
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update profile, role, status, group, totp_required (admin).
      description: |
        Demoting or disabling the last active admin fails with 409 `last_admin`.
        Disabling a user revokes all their sessions and client tokens.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserListItem" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user (admin). 409 `last_admin` for the last active admin; 409 `self` for yourself.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{user_id}/password:
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: Set a new password for a user (admin).
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/totp/reset:
    post:
      tags: [users]
      operationId: resetUserTotp
      summary: Remove the user's TOTP secret and recovery codes (admin). They must re-enrol if `totp_required`.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Reset. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/sessions:
    get:
      tags: [users]
      operationId: listUserSessions
      summary: Active panel sessions and client tokens of a user (admin).
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/sessions/revoke:
    post:
      tags: [users]
      operationId: revokeUserSessions
      summary: Revoke all sessions/tokens of a user, optionally only one kind (admin).
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind: { type: string, enum: [all, web, client], default: all }
      responses:
        "200":
          description: Number of revoked sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/sessions/{session_id}:
    delete:
      tags: [users]
      operationId: revokeUserSession
      summary: Revoke one session/token of a user (admin).
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/identities/{identity_id}:
    delete:
      tags: [users]
      operationId: unlinkUserIdentity
      summary: Unlink an IdP identity from a user (admin). 409 `last_login_method` if it is the only way to log in.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: identity_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Unlinked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /user-groups:
    get:
      tags: [groups]
      operationId: listUserGroups
      summary: List user groups (admin).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          schema: { type: string, default: name, enum: [name, -name, member_count, -member_count, created_at, -created_at] }
      responses:
        "200":
          description: Page of user groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroupPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [groups]
      operationId: createUserGroup
      summary: Create user group.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserGroupInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /user-groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    patch:
      tags: [groups]
      operationId: updateUserGroup
      summary: Update user group.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserGroupPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserGroup" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [groups]
      operationId: deleteUserGroup
      summary: Delete a user group; members fall back to no group.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /device-groups:
    get:
      tags: [groups]
      operationId: listDeviceGroups
      summary: List device groups (admin).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - name: sort
          in: query
          schema: { type: string, default: name, enum: [name, -name, device_count, -device_count, created_at, -created_at] }
      responses:
        "200":
          description: Page of device groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceGroupPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [groups]
      operationId: createDeviceGroup
      summary: Create device group.
      parameters:
